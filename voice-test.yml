.github/workflows/voice-test.yml
name: Deen in Sec Voice Test

on:
  workflow_dispatch:

jobs:
  voice:
    runs-on: ubuntu-latest

    steps:
      - name: Install Piper
        run: |
          python -m pip install piper-tts

      - name: Generate voice
        run: |
          mkdir -p output

          echo "Your actions might look good, but what really matters is why you did them. The reward of deeds depends upon the intentions, and every person will get the reward according to what they have intended." | \
          piper \
            --model en_US-lessac-medium \
            --output_file output/deen-in-sec-hadith-001.wav

      - name: Check audio
        run: |
          ls -lh output/deen-in-sec-hadith-001.wav
          file output/deen-in-sec-hadith-001.wav

      - name: Upload voice
        uses: actions/upload-artifact@v4
        with:
          name: deen-in-sec-voice-test
          path: output/deen-in-sec-hadith-001.wav
