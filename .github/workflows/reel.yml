name: Deen in Sec - Create Reel V6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-reel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu fonts-liberation2
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow piper-tts

      - name: Prepare folders
        run: |
          set -e
          rm -rf work output
          mkdir -p work/scenes work/voice work/subtitles output

      - name: Create cinematic scenes
        run: |
          cat > work/create_scenes.py <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          import math
          import os
          import random

          W = 1080
          H = 1920
          OUT = "work/scenes"
          random.seed(20260917)

          os.makedirs(OUT, exist_ok=True)

          def rgba(rgb, alpha=255):
              return (rgb[0], rgb[1], rgb[2], alpha)

          def gradient(top, bottom):
              img = Image.new("RGBA", (W, H))
              p = img.load()
              for y in range(H):
                  t = y / (H - 1)
                  c = tuple(
                      int(top[i] * (1 - t) + bottom[i] * t)
                      for i in range(3)
                  )
                  for x in range(W):
                      p[x, y] = (*c, 255)
              return img

          def glow(img, cx, cy, radius, color, alpha):
              layer = Image.new("RGBA", (W, H), (0, 0, 0, 0))
              d = ImageDraw.Draw(layer)
              for r in range(radius, 12, -18):
                  a = int(alpha * (1 - r / radius) ** 2)
                  d.ellipse(
                      (cx-r, cy-r, cx+r, cy+r),
                      fill=(*color, max(0, a))
                  )
              layer = layer.filter(ImageFilter.GaussianBlur(20))
              return Image.alpha_composite(img.convert("RGBA"), layer)

          def vignette(img):
              overlay = Image.new("RGBA", (W, H), (0, 0, 0, 0))
              d = ImageDraw.Draw(overlay)
              d.rectangle((0, 0, W, H), fill=(0, 0, 0, 55))
              d.ellipse(
                  (-250, -350, W+250, H+350),
                  fill=(0, 0, 0, 0),
                  outline=(0, 0, 0, 115),
                  width=260
              )
              return Image.alpha_composite(img.convert("RGBA"), overlay)

          def particles(img, count, y1, y2, seed):
              rng = random.Random(seed)
              d = ImageDraw.Draw(img)
              for _ in range(count):
                  x = rng.randint(35, W - 35)
                  y = rng.randint(y1, y2)
                  r = rng.choice([1, 1, 1, 2, 2, 3])
                  a = rng.randint(35, 125)
                  d.ellipse(
                      (x-r, y-r, x+r, y+r),
                      fill=(224, 190, 112, a)
                  )

          def crescent(img, cx, cy, radius):
              d = ImageDraw.Draw(img)
              d.ellipse(
                  (cx-radius, cy-radius, cx+radius, cy+radius),
                  fill=(244, 225, 169, 245)
              )
              d.ellipse(
                  (cx-radius+38, cy-radius-18,
                   cx+radius+38, cy+radius-18),
                  fill=(5, 8, 20, 255)
              )

          def mosque(img, base):
              d = ImageDraw.Draw(img)
              cx = W // 2

              d.rectangle(
                  (0, base, W, H),
                  fill=(4, 6, 11, 255)
              )

              d.rectangle(
                  (cx-310, base-230, cx+310, base+30),
                  fill=(5, 7, 12, 255)
              )

              d.ellipse(
                  (cx-310, base-650, cx+310, base-40),
                  fill=(5, 7, 12, 255)
              )

              for sx in (cx-430, cx+430):
                  d.rectangle(
                      (sx-58, base-540, sx+58, base+45),
                      fill=(4, 6, 11, 255)
                  )
                  d.polygon(
                      [
                          (sx-82, base-540),
                          (sx, base-675),
                          (sx+82, base-540)
                      ],
                      fill=(4, 6, 11, 255)
                  )
                  d.line(
                      (sx, base-675, sx, base-720),
                      fill=(204, 164, 83, 190),
                      width=4
                  )
                  d.ellipse(
                      (sx-8, base-732, sx+8, base-716),
                      fill=(224, 185, 101, 230)
                  )

              d.rounded_rectangle(
                  (cx-105, base-15, cx+105, base+35),
                  radius=80,
                  fill=(21, 15, 12, 255)
              )

              for x in (cx-220, cx+220):
                  d.ellipse(
                      (x-32, base-190, x+32, base-125),
                      fill=(177, 135, 62, 90)
                  )

          # Scene 1: night mosque
          scene = gradient((3, 7, 19), (27, 17, 14))
          scene = glow(scene, 800, 315, 250, (220, 181, 91), 135)
          crescent(scene, 800, 315, 94)

          d = ImageDraw.Draw(scene)
          rng = random.Random(11)
          for _ in range(190):
              x = rng.randint(25, 1055)
              y = rng.randint(65, 1050)
              r = rng.choice([1, 1, 2, 2, 3])
              a = rng.randint(45, 175)
              d.ellipse((x-r, y-r, x+r, y+r),
                        fill=(229, 218, 188, a))

          mosque(scene, 1430)
          particles(scene, 85, 900, 1700, 12)
          scene = vignette(scene)
          scene.save(f"{OUT}/scene1.png")

          # Scene 2: illuminated Hadith book
          scene = gradient((12, 8, 7), (55, 32, 16))
          scene = glow(scene, 540, 940, 580, (208, 158, 74), 85)
          d = ImageDraw.Draw(scene)

          for y in range(0, H, 48):
              d.line(
                  (0, y, W, y+random.randint(-5, 5)),
                  fill=(111, 67, 31, 55),
                  width=2
              )

          d.rounded_rectangle(
              (90, 595, 990, 1515),
              radius=58,
              fill=(5, 4, 3, 165)
          )

          d.rounded_rectangle(
              (112, 565, 968, 1450),
              radius=55,
              fill=(67, 38, 17, 255),
              outline=(191, 143, 62, 220),
              width=7
          )

          d.polygon(
              [(175, 655), (520, 710), (540, 1380), (175, 1315)],
              fill=(239, 226, 193, 255)
          )

          d.polygon(
              [(905, 655), (560, 710), (540, 1380), (905, 1315)],
              fill=(231, 218, 183, 255)
          )

          d.line(
              (540, 710, 540, 1380),
              fill=(111, 75, 39, 255),
              width=9
          )

          for yy in range(785, 1280, 67):
              d.line(
                  (235, yy, 478, yy+32),
                  fill=(100, 70, 44, 145),
                  width=5
              )
              d.line(
                  (602, yy+32, 845, yy),
                  fill=(100, 70, 44, 145),
                  width=5
              )

          d.rectangle(
              (790, 630, 837, 1195),
              fill=(198, 146, 54, 220)
          )

          d.polygon(
              [(790, 1195), (814, 1150), (837, 1195)],
              fill=(198, 146, 54, 220)
          )

          particles(scene, 65, 450, 1600, 22)
          scene = vignette(scene)
          scene.save(f"{OUT}/scene2.png")

          # Scene 3: moonlit landscape
          scene = gradient((3, 7, 20), (25, 34, 41))
          scene = glow(scene, 795, 350, 260, (226, 195, 120), 125)
          d = ImageDraw.Draw(scene)

          d.ellipse(
              (705, 260, 875, 430),
              fill=(241, 229, 191, 245)
          )
          d.ellipse(
              (758, 235, 910, 387),
              fill=(4, 9, 21, 255)
          )

          d.polygon(
              [
                  (0, 1250), (180, 1000), (370, 1230),
                  (600, 875), (850, 1210), (1080, 1010),
                  (1080, H), (0, H)
              ],
              fill=(6, 13, 20, 255)
          )

          d.polygon(
              [
                  (0, 1430), (250, 1140), (505, 1435),
                  (760, 1100), (1080, 1390),
                  (1080, H), (0, H)
              ],
              fill=(8, 19, 25, 255)
          )

          d.rectangle(
              (0, 1500, W, H),
              fill=(6, 20, 28, 255)
          )

          for i in range(17):
              yy = 1530 + i * 38
              width = max(12, 145 - i * 7)
              d.line(
                  (540-width, yy, 540+width, yy),
                  fill=(195, 166, 104, max(15, 88-i*4)),
                  width=4
              )

          particles(scene, 105, 100, 1350, 33)
          scene = vignette(scene)
          scene.save(f"{OUT}/scene3.png")

          # Scene 4: mosque interior
          scene = gradient((8, 7, 7), (52, 34, 19))
          scene = glow(scene, 540, 390, 390, (231, 191, 111), 80)
          d = ImageDraw.Draw(scene)

          d.rectangle(
              (130, 420, 950, 1530),
              fill=(41, 30, 22, 255)
          )

          d.ellipse(
              (130, 160, 950, 690),
              fill=(41, 30, 22, 255)
          )

          d.rectangle(
              (205, 455, 875, 1530),
              fill=(10, 9, 8, 255)
          )

          for x in (78, 907):
              d.rounded_rectangle(
                  (x, 345, x+95, 1580),
                  radius=18,
                  fill=(65, 48, 33, 255)
              )

          for x in (250, 540, 830):
              d.line(
                  (x, 0, x, 345),
                  fill=(177, 137, 64, 150),
                  width=3
              )
              d.ellipse(
                  (x-20, 330, x+20, 395),
                  fill=(235, 195, 103, 150)
              )

          for y in range(1480, H, 105):
              d.line(
                  (65, y, 1015, y),
                  fill=(125, 91, 52, 105),
                  width=2
              )

          for x in range(80, 1080, 120):
              d.line(
                  (x, 1480, x-110, H),
                  fill=(125, 91, 52, 70),
                  width=2
              )

          beam = Image.new("RGBA", (W, H), (0, 0, 0, 0))
          bd = ImageDraw.Draw(beam)
          bd.polygon(
              [(420, 0), (660, 0), (790, 1480), (290, 1480)],
              fill=(245, 207, 135, 35)
          )
          beam = beam.filter(ImageFilter.GaussianBlur(24))
          scene = Image.alpha_composite(scene, beam)

          particles(scene, 100, 180, 1600, 44)
          scene = vignette(scene)
          scene.save(f"{OUT}/scene4.png")

          # Scene 5: dawn mosque
          scene = gradient((13, 19, 38), (126, 73, 36))
          scene = glow(scene, 540, 620, 380, (255, 195, 104), 155)
          d = ImageDraw.Draw(scene)

          d.ellipse(
              (465, 545, 615, 695),
              fill=(255, 215, 139, 238)
          )

          rays = Image.new("RGBA", (W, H), (0, 0, 0, 0))
          rd = ImageDraw.Draw(rays)

          for angle in range(-70, 71, 14):
              a = math.radians(angle)
              x2 = 540 + int(math.sin(a) * 1350)
              y2 = 620 + int(math.cos(a) * 1350)
              rd.polygon(
                  [(540, 620), (x2-18, y2), (x2+18, y2)],
                  fill=(255, 205, 125, 19)
              )

          rays = rays.filter(ImageFilter.GaussianBlur(16))
          scene = Image.alpha_composite(scene, rays)

          mosque(scene, 1390)
          particles(scene, 80, 430, 1550, 55)
          scene = vignette(scene)
          scene.save(f"{OUT}/scene5.png")

          print("Created five cinematic scenes.")
          PY

          python3 work/create_scenes.py

      - name: Verify scenes
        run: |
          set -e
          for f in work/scenes/scene{1,2,3,4,5}.png; do
            test -s "$f"
            identify_output="$(file "$f")"
            echo "$f: $identify_output"
          done

      - name: Download masculine Piper voice
        run: |
          set -e
          python3 -m piper.download_voices en_US-hfc_male-medium
          VOICE_MODEL="$(
            find "$HOME" \
              -type f \
              -name "en_US-hfc_male-medium.onnx" \
              | head -n 1
          )"
          test -n "$VOICE_MODEL"
          echo "VOICE_MODEL=$VOICE_MODEL" >> "$GITHUB_ENV"

      - name: Create approved narration
        run: |
          set -e

          cat > work/voice/part1.txt <<'EOF'
          Your actions might look good... but what really matters is WHY you did them.
          EOF

          cat > work/voice/part2.txt <<'EOF'
          The Prophet Muhammad, peace and blessings be upon him, said:
          EOF

          cat > work/voice/part3.txt <<'EOF'
          The reward of deeds depends upon the intentions, and every person will get the reward according to what they have intended.
          EOF

          cat > work/voice/part4.txt <<'EOF'
          So before you do something... ask yourself: Why am I doing this?
          EOF

          cat > work/voice/part5.txt <<'EOF'
          A small action with a sincere intention can have a huge reward.
          EOF

          cat > work/voice/part6.txt <<'EOF'
          What will you make your intention for today?
          EOF

          cat > work/voice/part7.txt <<'EOF'
          Sahih al-Bukhari 1. Narrated by Umar ibn al-Khattab.
          EOF

          for n in 1 2 3 4 5 6 7; do
            test -s "work/voice/part${n}.txt"
          done

      - name: Generate narration parts
        run: |
          set -e

          for n in 1 2 3 4 5 6 7; do
            python3 -m piper \
              --model "$VOICE_MODEL" \
              --input_file "work/voice/part${n}.txt" \
              --output_file "work/voice/raw${n}.wav"

            ffmpeg -y -loglevel error \
              -i "work/voice/raw${n}.wav" \
              -filter:a "atempo=0.92" \
              "work/voice/part${n}.wav"
          done

      - name: Build narration timeline
        run: |
          set -e

          ffmpeg -y -loglevel error \
            -f lavfi \
            -i "anullsrc=r=22050:cl=mono" \
            -t 0.80 \
            work/voice/pause_long.wav

          ffmpeg -y -loglevel error \
            -f lavfi \
            -i "anullsrc=r=22050:cl=mono" \
            -t 0.45 \
            work/voice/pause_short.wav

          cat > work/voice/list.txt <<'EOF'
          file 'part1.wav'
          file 'pause_long.wav'
          file 'part2.wav'
          file 'pause_short.wav'
          file 'part3.wav'
          file 'pause_long.wav'
          file 'part4.wav'
          file 'pause_short.wav'
          file 'part5.wav'
          file 'pause_short.wav'
          file 'part6.wav'
          file 'pause_long.wav'
          file 'part7.wav'
          EOF
                    cd work/voice

          ffmpeg -y -loglevel error \
            -f concat \
            -safe 0 \
            -i list.txt \
            -c:a pcm_s16le \
            voice_raw.wav

          cd ../..

          ORIGINAL_DURATION="$(
            ffprobe -v error \
              -show_entries format=duration \
              -of csv=p=0 \
              work/voice/voice_raw.wav
          )"

          python3 - "$ORIGINAL_DURATION" <<'PY'
          import sys

          duration = float(sys.argv[1])

          if duration < 35.0 or duration > 39.0:
              speed = duration / 37.0
              speed = max(0.50, min(2.00, speed))
          else:
              speed = 1.0

          with open("work/voice/speed.txt", "w") as f:
              f.write(f"{speed:.8f}")

          print(f"Original duration: {duration:.3f}")
          print(f"Selected atempo: {speed:.8f}")
          PY

          SPEED="$(cat work/voice/speed.txt)"

          ffmpeg -y -loglevel error \
            -i work/voice/voice_raw.wav \
            -filter:a "atempo=${SPEED},loudnorm=I=-16:TP=-1.5:LRA=11" \
            work/voice/voice.wav

          VOICE_DURATION="$(
            ffprobe -v error \
              -show_entries format=duration \
              -of csv=p=0 \
              work/voice/voice.wav
          )"

          echo "VOICE_DURATION=$VOICE_DURATION" >> "$GITHUB_ENV"
          echo "Final narration duration: $VOICE_DURATION"

      - name: Create subtitle timings
        run: |
          set -e

          python3 - <<'PY'
          import subprocess

          def dur(path):
              value = subprocess.check_output(
                  [
                      "ffprobe",
                      "-v", "error",
                      "-show_entries", "format=duration",
                      "-of", "csv=p=0",
                      path
                  ]
              ).decode().strip()
              return float(value)

          parts = [
              dur(f"work/voice/part{i}.wav")
              for i in range(1, 8)
          ]

          pauses = [0.80, 0.45, 0.80, 0.45, 0.45, 0.80]

          raw_total = sum(parts) + sum(pauses)
          final_total = dur("work/voice/voice.wav")
          scale = final_total / raw_total

          starts = []
          cursor = 0.0

          for i, length in enumerate(parts):
              start = cursor
              end = cursor + length
              starts.append((start * scale, end * scale))

              cursor = end

              if i < len(pauses):
                  cursor += pauses[i]

          with open("work/subtitles/timing.txt", "w") as f:
              for i, (start, end) in enumerate(starts, 1):
                  f.write(
                      f"{i}|{start:.4f}|{end:.4f}\n"
                  )

          with open("work/subtitles/brand_start.txt", "w") as f:
              f.write(f"{starts[6][0]:.4f}")

          print("Subtitle timings:")
          for i, pair in enumerate(starts, 1):
              print(i, pair)
          PY

      - name: Calculate video geometry
        run: |
          set -e

          python3 - "$VOICE_DURATION" <<'PY'
          import sys

          voice = float(sys.argv[1])
          end_pad = 0.25
          transition = 0.60

          video_duration = voice + end_pad
          scene_length = (
              video_duration + 4 * transition
          ) / 5.0

          frames = max(
              1,
              round(scene_length * 30)
          )

          offsets = [
              scene_length - transition,
              2 * scene_length - 2 * transition,
              3 * scene_length - 3 * transition,
              4 * scene_length - 4 * transition
          ]

          with open("work/animation.env", "w") as f:
              f.write(f"SCENE_LEN={scene_length:.6f}\n")
              f.write(f"FRAMES={frames}\n")
              f.write(f"VIDEO_DURATION={video_duration:.6f}\n")

              for i, value in enumerate(offsets, 1):
                  f.write(f"OFFSET{i}={value:.6f}\n")

          print(f"Voice: {voice:.3f}s")
          print(f"Video: {video_duration:.3f}s")
          print(f"Scene: {scene_length:.3f}s")
          print(f"Frames: {frames}")
          print("Offsets:", offsets)
          PY

      - name: Animate cinematic camera movement
        run: |
          set -e
          source work/animation.env

          for n in 1 2 3 4 5; do
            case "$n" in
              1)
                X="iw/2-(iw/zoom/2)+sin(on/65)*30"
                Y="ih/2-(ih/zoom/2)+cos(on/82)*18"
                ;;
              2)
                X="iw/2-(iw/zoom/2)-sin(on/72)*34"
                Y="ih/2-(ih/zoom/2)+cos(on/88)*22"
                ;;
              3)
                X="iw/2-(iw/zoom/2)+sin(on/84)*28"
                Y="ih/2-(ih/zoom/2)-cos(on/76)*20"
                ;;
              4)
                X="iw/2-(iw/zoom/2)-sin(on/78)*30"
                Y="ih/2-(ih/zoom/2)-cos(on/90)*24"
                ;;
              5)
                X="iw/2-(iw/zoom/2)+sin(on/92)*26"
                Y="ih/2-(ih/zoom/2)+cos(on/74)*20"
                ;;
            esac

            ffmpeg -y -loglevel error \
              -loop 1 \
              -i "work/scenes/scene${n}.png" \
              -vf "scale=1620:2880:force_original_aspect_ratio=increase,crop=1620:2880,zoompan=z='min(zoom+0.00065,1.055)':x='${X}':y='${Y}':d=${FRAMES}:s=1080x1920:fps=30,format=yuv420p" \
              -t "$SCENE_LEN" \
              -an \
              "work/scene${n}.mp4"
          done

      - name: Join cinematic scenes
        run: |
          set -e
          source work/animation.env

          ffmpeg -y -loglevel error \
            -i work/scene1.mp4 \
            -i work/scene2.mp4 \
            -i work/scene3.mp4 \
            -i work/scene4.mp4 \
            -i work/scene5.mp4 \
            -filter_complex "
              [0:v][1:v]xfade=transition=fade:duration=0.60:offset=${OFFSET1}[v01];
              [v01][2:v]xfade=transition=fade:duration=0.60:offset=${OFFSET2}[v012];
              [v012][3:v]xfade=transition=fade:duration=0.60:offset=${OFFSET3}[v0123];
              [v0123][4:v]xfade=transition=fade:duration=0.60:offset=${OFFSET4},format=yuv420p[v]
            " \
            -map "[v]" \
            -t "$VIDEO_DURATION" \
            -an \
            work/background.mp4

      - name: Create safe professional subtitles
        run: |
          set -e

          python3 - <<'PY'
          def ass_time(value):
              value = max(0.0, float(value))
              h = int(value // 3600)
              m = int((value % 3600) // 60)
              s = int(value % 60)
              cs = int(round((value - int(value)) * 100))

              if cs >= 100:
                  s += 1
                  cs = 0

              return f"{h}:{m:02d}:{s:02d}.{cs:02d}"

          timings = {}

          with open("work/subtitles/timing.txt") as f:
              for line in f:
                  i, start, end = line.strip().split("|")
                  timings[int(i)] = (
                      float(start),
                      float(end)
                  )

          captions = {
              1:
              "Your actions might look good...\\N"
              "but what really matters is "
              "{\\\\c&H00D7FF&}WHY{\\\\c&HFFFFFF&} you did them.",

              2:
              "The Prophet Muhammad,\\N"
              "peace and blessings be upon him, said:",

              3:
              "The reward of deeds depends\\N"
              "upon the intentions,\\N"
              "and every person will get the reward\\N"
              "according to what they have intended.",

              4:
              "So before you do something...\\N"
              "ask yourself:\\N"
              "{\\\\c&H00D7FF&}Why am I doing this?{\\\\c&HFFFFFF&}",

              5:
              "A small action with a sincere\\N"
              "{\\\\c&H00D7FF&}intention{\\\\c&HFFFFFF&}\\N"
              "can have a huge reward.",

              6:
              "What will you make your\\N"
              "{\\\\c&H00D7FF&}intention{\\\\c&HFFFFFF&} for today?",

              7:
              "Sahih al-Bukhari 1\\N"
              "Narrated by Umar ibn al-Khattab."
          }

          header = """[Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920
          WrapStyle: 2
          ScaledBorderAndShadow: yes

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, TertiaryColour, BackColour, Bold, Italic, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Main,DejaVu Sans,47,&H00FFFFFF,&H00FFFFFF,&H00000000,&HAA000000,0,0,1,3,1,2,125,125,245,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          """

          with open(
              "work/subtitles/hadith.ass",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(header)

              for i in range(1, 8):
                  start, end = timings[i]

                  f.write(
                      "Dialogue: 0,"
                      + ass_time(start)
                      + ","
                      + ass_time(end)
                      + ",Main,,0,0,245,,"
                      + captions[i]
                      + "\n"
                  )

          print("ASS subtitles created.")

      - name: Render final reel
        run: |
          set -e
          source work/animation.env

          BRAND_START="$(
            cat work/subtitles/brand_start.txt
          )"

          ffmpeg -y -loglevel error \
            -i work/background.mp4 \
            -i work/voice/voice.wav \
            -filter_complex "
              [0:v]
              drawbox=x=70:y=118:w=940:h=2:color=0xD3A84F@0.55:t=fill,
              drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='DEEN IN SEC':fontsize=31:fontcolor=0xE6C46A@0.92:borderw=2:bordercolor=black@0.35:x=(w-text_w)/2:y=67,
              subtitles=work/subtitles/hadith.ass:force_style='FontName=DejaVu Sans,FontSize=47,MarginL=125,MarginR=125,MarginV=245,Alignment=2,Outline=3,Shadow=1',
              drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='DEEN IN SEC':fontsize=58:fontcolor=0xE6C46A@0.94:borderw=3:bordercolor=black@0.45:x=(w-text_w)/2:y=925:enable='gte(t,${BRAND_START})',
              fade=t=out:st=${VOICE_DURATION}:d=0.25
              [v]
            " \
            -map "[v]" \
            -map 1:a \
            -c:v libx264 \
            -preset medium \
            -crf 18 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 192k \
            -t "$VIDEO_DURATION" \
            -movflags +faststart \
            output/deen-in-sec-hadith-001-v6.mp4

      - name: Create caption
        run: |
          cat > output/caption.txt <<'EOF'
          Your actions might look good… but what really matters is why you did them.

          A reminder from Sahih al-Bukhari 1:
          the reward of deeds depends upon intentions.

          What will you make your intention for today? 🤍

          Source: Sahih al-Bukhari 1
          Narrated by Umar ibn al-Khattab

          #Islam #Hadith #Sunnah #IslamicReminder #Muslim #DeenInSec #IslamicReels #Quran #Reminder
          EOF

      - name: Verify final files
        run: |
          set -e

          test -s output/deen-in-sec-hadith-001-v6.mp4
          test -s output/caption.txt

          DURATION="$(
            ffprobe -v error \
              -show_entries format=duration \
              -of csv=p=0 \
              output/deen-in-sec-hadith-001-v6.mp4
          )"

          WIDTH="$(
            ffprobe -v error \
              -select_streams v:0 \
              -show_entries stream=width \
              -of csv=p=0 \
              output/deen-in-sec-hadith-001-v6.mp4
          )"

          HEIGHT="$(
            ffprobe -v error \
              -select_streams v:0 \
              -show_entries stream=height \
              -of csv=p=0 \
              output/deen-in-sec-hadith-001-v6.mp4
          )"

          AUDIO="$(
            ffprobe -v error \
              -select_streams a:0 \
              -show_entries stream=codec_name \
              -of csv=p=0 \
              output/deen-in-sec-hadith-001-v6.mp4
          )"

          echo "Duration: $DURATION"
          echo "Resolution: ${WIDTH}x${HEIGHT}"
          echo "Audio codec: $AUDIO"

          test "$WIDTH" = "1080"
          test "$HEIGHT" = "1920"
          test "$AUDIO" = "aac"

          ls -lh output/

      - name: Upload final V6 artifact
        uses: actions/upload-artifact@v4
        with:
          name: deen-in-sec-hadith-001-v6
          path: |
            output/deen-in-sec-hadith-001-v6.mp4
            output/caption.txt
          retention-days: 7
