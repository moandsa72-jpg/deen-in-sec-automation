      # ============================================================
      - name: Calculate subtitle timings
        run: |
          python3 - <<'PY'

          import subprocess
          import os

          parts = []

          for i in range(1, 8):

              path = f"work/voice/part{i}.wav"

              result = subprocess.run(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:nokey=1",
                      path
                  ],
                  capture_output=True,
                  text=True
              )

              duration = float(
                  result.stdout.strip()
              )

              parts.append(duration)

          print("VOICE DURATIONS")

          for i, d in enumerate(
              parts,
              start=1
          ):
              print(
                  f"Part {i}: {d:.3f}s"
              )

          # Pauses used in concat:
          #
          # part1
          # pause_long
          # part2
          # pause_short
          # part3
          # pause_long
          # part4
          # pause_short
          # part5
          # pause_short
          # part6
          # pause_long
          # part7

          pauses = [
              0.80,
              0.45,
              0.80,
              0.45,
              0.45,
              0.80
          ]

          starts = []

          current = 0.0

          for index, duration in enumerate(parts):

              start = current
              end = current + duration

              starts.append(
                  (
                      start,
                      end
                  )
              )

              current = end

              if index < len(pauses):
                  current += pauses[index]

          print(
              f"Calculated voice length: {current:.3f}s"
          )

          with open(
              "work/voice_timings.txt",
              "w"
          ) as f:

              for i, (start, end) in enumerate(
                  starts,
                  start=1
              ):

                  f.write(
