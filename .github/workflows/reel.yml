name: Deen in Sec - Create Reel V7

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-reel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu python3-pip
          python -m pip install --upgrade pip
          python -m pip install piper-tts requests pillow

      - name: Check Pexels key
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ -z "$PEXELS_API_KEY" ]; then
            echo "PEXELS_API_KEY GitHub secret is missing."
            exit 1
          fi

      - name: Prepare folders
        run: |
          rm -rf work output
          mkdir -p work/assets work/voice work/scenes output

      - name: Download real stock footage from Pexels
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          cat > work/download_assets.py <<'PY'
          import os
          import requests
          import sys
          import json
          import time
          from pathlib import Path

          API = "https://api.pexels.com/v1/videos/search"
          KEY = os.environ["PEXELS_API_KEY"]
          OUT = Path("work/assets")
          OUT.mkdir(parents=True, exist_ok=True)

          searches = [
              ("scene1", "mosque architecture night cinematic"),
              ("scene2", "quran open book close up cinematic"),
              ("scene3", "night sky mountains peaceful cinematic"),
              ("scene4", "mosque interior architecture cinematic"),
              ("scene5", "mosque sunrise dawn cinematic"),
          ]

          headers = {
              "Authorization": KEY,
              "User-Agent": "DeenInSec/7.0"
          }

          session = requests.Session()

          def fail(msg):
              print(msg)
              sys.exit(1)

          for name, query in searches:
              print(f"Searching Pexels: {query}")

              r = session.get(
                  API,
                  headers=headers,
                  params={
                      "query": query,
                      "orientation": "portrait",
                      "size": "large",
                      "per_page": 15,
                  },
                  timeout=30,
              )

              if r.status_code != 200:
                  fail(
                      f"Pexels search failed: HTTP "
                      f"{r.status_code}: {r.text[:500]}"
                  )

              data = r.json()
              videos = data.get("videos", [])

              if not videos:
                  fail(f"No Pexels results for {query}")

              chosen = None

              for v in videos:
                  files = v.get("video_files", [])

                  files = sorted(
                      files,
                      key=lambda x: (
                          x.get("width", 0) * x.get("height", 0),
                          x.get("height", 0)
                      ),
                      reverse=True,
                  )

                  usable = [
                      f for f in files
                      if f.get("link")
                      and f.get("width", 0) >= 720
                      and f.get("height", 0) >= 720
                  ]

                  if usable and v.get("duration", 0) >= 5:
                      chosen = (v, usable[0])
                      break

              if not chosen:
                  fail(
                      f"No usable high-resolution clip for {query}"
                  )

              video, vf = chosen
              url = vf["link"]
              target = OUT / f"{name}.mp4"

              print(
                  f"Downloading Pexels video "
                  f"{video['id']} -> {target}"
              )

              with session.get(
                  url,
                  stream=True,
                  timeout=120
              ) as dl:

                  if dl.status_code != 200:
                      fail(
                          f"Download failed: HTTP "
                          f"{dl.status_code}"
                      )

                  with open(target, "wb") as f:
                      for chunk in dl.iter_content(
                          chunk_size=1024 * 1024
                      ):
                          if chunk:
                              f.write(chunk)

              source = {
                  "pexels_video_id": video.get("id"),
                  "pexels_page": video.get("url"),
                  "photographer": video.get(
                      "user", {}
                  ).get("name", ""),
                  "query": query,
                  "download_url": url,
                  "width": vf.get("width"),
                  "height": vf.get("height"),
                  "duration": video.get("duration"),
              }

              (OUT / f"{name}.json").write_text(
                  json.dumps(
                      source,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              time.sleep(0.5)
          PY

          python work/download_assets.py

      - name: Generate male voice
        run: |
          python -m piper.download_voices en_US-hfc_male-medium

          cat > work/voice/part1.txt <<'EOF'
          Your actions might look good... but what really matters is WHY you did them.
          EOF

          cat > work/voice/part2.txt <<'EOF'
          The Prophet Muhammad, peace and blessings be upon him, said:
          EOF

          cat > work/voice/part3.txt <<'EOF'
          The reward of deeds depends upon the intentions, and every person will get the reward according to what they have intended.
          EOF

          cat > work/voice/part4.txt <<'EOF'
          So before you do something... ask yourself... Why am I doing this?
          EOF

          cat > work/voice/part5.txt <<'EOF'
          A small action with a sincere intention can have a huge reward.
          EOF

          cat > work/voice/part6.txt <<'EOF'
          What will you make your intention for today?
          EOF

          cat > work/voice/part7.txt <<'EOF'
          Sahih al-Bukhari 1. Narrated by Umar ibn al-Khattab.
          EOF

          for n in 1 2 3 4 5 6 7; do
            python -m piper \
              -m en_US-hfc_male-medium \
              -f "work/voice/p$n.wav" \
              < "work/voice/part$n.txt"

            ffmpeg -y -loglevel error \
              -i "work/voice/p$n.wav" \
              -filter:a "atempo=0.80" \
              "work/voice/s$n.wav"
          done

          python - <<'PY'
          from pathlib import Path
          import wave

          pauses = {
              1: 1.10,
              2: 0.80,
              3: 0.70,
              4: 1.10,
              5: 1.00,
              6: 1.00,
          }

          rate = 22050

          for n, seconds in pauses.items():
              path = Path(
                  f"work/voice/pause{n}.wav"
              )

              count = int(rate * seconds)

              with wave.open(str(path), "wb") as w:
                  w.setnchannels(1)
                  w.setsampwidth(2)
                  w.setframerate(rate)
                  w.writeframes(
                      b"\0\0" * count
                  )

          lines = []

          for n in range(1, 8):
              lines.append(
                  f"file '{Path(f'work/voice/s{n}.wav').resolve()}'"
              )

              if n != 7:
                  lines.append(
                      f"file '{Path(f'work/voice/pause{n}.wav').resolve()}'"
                  )

          Path(
              "work/voice/concat.txt"
          ).write_text(
              "\n".join(lines) + "\n"
          )
          PY

          ffmpeg -y -loglevel error \
            -f concat \
            -safe 0 \
            -i work/voice/concat.txt \
            -c:a pcm_s16le \
            work/voice/final.wav

      - name: Measure narration
        run: |
          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            work/voice/final.wav \
            > work/voice/duration.txt

          D=$(cat work/voice/duration.txt)

          echo "Narration duration: $D seconds"

          python - <<'PY'
          d = float(
              open(
                  "work/voice/duration.txt"
              ).read()
          )

          if d < 32 or d > 44:
              raise SystemExit(
                  f"Narration duration {d:.2f}s "
                  "is outside 32-44s."
              )
          PY

      - name: Build cinematic stock scenes
        run: |
          for n in 1 2 3 4 5; do
            ffmpeg \
              -y \
              -loglevel error \
              -stream_loop -1 \
              -i "work/assets/scene$n.mp4" \
              -t 10 \
              -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,eq=contrast=1.05:brightness=-0.02:saturation=0.90,curves=all='0/0 0.22/0.14 0.50/0.52 0.78/0.86 1/1',vignette=PI/5,format=yuv420p" \
              -an \
              "work/scenes/scene$n.mp4"
          done

      - name: Create cinematic scene transitions
        run: |
          ffmpeg \
            -y \
            -loglevel error \
            -i work/scenes/scene1.mp4 \
            -i work/scenes/scene2.mp4 \
            -i work/scenes/scene3.mp4 \
            -i work/scenes/scene4.mp4 \
            -i work/scenes/scene5.mp4 \
            -filter_complex "
              [0:v]
              trim=duration=10,
              setpts=PTS-STARTPTS,
              zoompan=
              z='min(zoom+0.00030,1.08)':
              x='iw/2-(iw/zoom/2)':
              y='ih/2-(ih/zoom/2)':
              d=1:
              s=1080x1920:
              fps=30
              [v0];

              [1:v]
              trim=duration=10,
              setpts=PTS-STARTPTS,
              zoompan=
              z='min(zoom+0.00024,1.07)':
              x='iw/2-(iw/zoom/2)':
              y='ih/2-(ih/zoom/2)':
              d=1:
              s=1080x1920:
              fps=30
              [v1];

              [2:v]
              trim=duration=10,
              setpts=PTS-STARTPTS,
              zoompan=
              z='min(zoom+0.00028,1.08)':
              x='iw/2-(iw/zoom/2)':
              y='ih/2-(ih/zoom/2)':
              d=1:
              s=1080x1920:
              fps=30
              [v2];

              [3:v]
              trim=duration=10,
              setpts=PTS-STARTPTS,
              zoompan=
              z='min(zoom+0.00030,1.08)':
              x='iw/2-(iw/zoom/2)':
              y='ih/2-(ih/zoom/2)':
              d=1:
              s=1080x1920:
              fps=30
              [v3];

              [4:v]
              trim=duration=10,
              setpts=PTS-STARTPTS,
              zoompan=
              z='min(zoom+0.00022,1.07)':
              x='iw/2-(iw/zoom/2)':
              y='ih/2-(ih/zoom/2)':
              d=1:
              s=1080x1920:
              fps=30
              [v4];

              [v0][v1]
              xfade=
              transition=fade:
              duration=0.70:
              offset=9.30
              [x1];

              [x1][v2]
              xfade=
              transition=fade:
              duration=0.70:
              offset=18.60
              [x2];

              [x2][v3]
              xfade=
              transition=fade:
              duration=0.70:
              offset=27.90
              [x3];

              [x3][v4]
              xfade=
              transition=fade:
              duration=0.70:
              offset=37.20
              [v]
            " \
            -map "[v]" \
            -an \
            -r 30 \
            -pix_fmt yuv420p \
            work/video_base.mp4

            - name: Create subtitles
        run: |
          python - <<'PY'
          from pathlib import Path
          import wave

          voice_dir = Path("work/voice")

          parts = [
              (1, "Your actions might look good... but what really matters is WHY you did them."),
              (2, "The Prophet Muhammad, peace and blessings be upon him, said:"),
              (3, "The reward of deeds depends upon the intentions, and every person will get the reward according to what they have intended."),
              (4, "So before you do something... ask yourself... Why am I doing this?"),
              (5, "A small action with a sincere intention can have a huge reward."),
              (6, "What will you make your intention for today?"),
              (7, "Sahih al-Bukhari 1. Narrated by Umar ibn al-Khattab.")
          ]

          pauses = {
              1: 1.10,
              2: 0.80,
              3: 0.70,
              4: 1.10,
              5: 1.00,
              6: 1.00
          }

          def wav_duration(path):
              with wave.open(str(path), "rb") as w:
                  return w.getnframes() / float(w.getframerate())

          events = []
          current = 0.0

          for number, text in parts:
              wav = voice_dir / f"part{number}.wav"

              if not wav.exists():
                  continue

              duration = wav_duration(wav)
              start = current
              end = current + duration

              events.append((start, end, text))
              current = end

              if number in pauses:
                  current += pauses[number]

          def ass_time(seconds):
              seconds = max(0.0, seconds)
              h = int(seconds // 3600)
              m = int((seconds % 3600) // 60)
              s = int(seconds % 60)
              cs = int(round((seconds - int(seconds)) * 100))

              if cs >= 100:
                  s += 1
                  cs = 0

              return f"{h}:{m:02d}:{s:02d}.{cs:02d}"

          header = """[Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920
          WrapStyle: 2
          ScaledBorderAndShadow: yes

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Main,DejaVu Sans,54,&H00FFFFFF,&H00FFFFFF,&H00111111,&H80000000,1,0,0,0,100,100,0,0,1,3,1,2,90,90,260,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          """

          lines = [header]

          for start, end, text in events:
              clean = (
                  text
                  .replace("&", "&")
                  .replace("{", r"\{")
                  .replace("}", r"\}")
              )

              lines.append(
                  f"Dialogue: 0,{ass_time(start)},{ass_time(end)},Main,,0,0,0,,{clean}"
              )

          Path("work/subtitles.ass").write_text(
              "\n".join(lines),
              encoding="utf-8"
          )

          print("Subtitle file created successfully.")
          print(f"Subtitle events: {len(events)}")
          PY

          echo "Checking subtitle file..."
          test -s work/subtitles.ass
          wc -l work/subtitles.ass
      
            - name: Render final Reel
              run: |
          D=$(cat work/voice/duration.txt)

          python - <<'PY'
          from pathlib import Path

          d = float(
              Path("work/voice/duration.txt").read_text()
          )

          fade_start = max(0.0, d - 0.45)

          filter_text = f"""
          [0:v]
          trim=duration={d:.6f},
          setpts=PTS-STARTPTS,
          subtitles=work/subtitles.ass,
          drawbox=
          x=40:
          y=40:
          w=1000:
          h=1830:
          color=black@0.06:
          t=2,
          drawtext=
          fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:
          text='DEEN IN SEC':
          fontcolor=white@0.72:
          fontsize=28:
          x=(w-text_w)/2:
          y=72:
          enable=between(t,0,3),
          drawtext=
          fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:
          text='DEEN IN SEC':
          fontcolor=white@0.88:
          fontsize=44:
          x=(w-text_w)/2:
          y=h-170:
          enable=gte(t,{fade_start - 1.2:.6f}),
          fade=t=in:st=0:d=0.45,
          fade=t=out:st={fade_start:.6f}:d=0.45
          [v]
          """

          Path(
              "work/final_filter.txt"
          ).write_text(
              filter_text,
              encoding="utf-8"
          )
          PY

          echo "Rendering final Reel..."
          echo "Duration: $D seconds"

          ffmpeg \
            -y \
            -loglevel error \
            -i work/video_base.mp4 \
            -i work/voice/final.wav \
            -filter_complex_script work/final_filter.txt \
            -map "[v]" \
            -map 1:a \
            -t "$D" \
            -c:v libx264 \
            -preset medium \
            -crf 19 \
            -c:a aac \
            -b:a 192k \
            -movflags +faststart \
            output/deen-in-sec-hadith-001-v7.mp4
      
          )

          caption = """Your actions might look good... but what really matters is WHY you did them.

          The reward of deeds depends upon the intentions, and every person will get the reward according to what they have intended.

          What will you make your intention for today? 🤍

          Sahih al-Bukhari 1
           Narrated by Umar ibn al-Khattab رضي الله عنه
 
          Footage: Pexels — https://www.pexels.com/
 
          #DeenInSec #Hadith #Islam #Sunnah #SahihBukhari #Reminder #IslamicReminder"""

            - name: Add source and caption files
              run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rows = []

          for n in range(1, 6):
              p = Path(f"work/assets/scene{n}.json")
              rows.append(json.loads(p.read_text()))

          text = [
              "DEEN IN SEC — V7",
              "",
              "Visual footage: Pexels",
              "Pexels API was used to retrieve the stock footage.",
              "",
          ]

          for i, r in enumerate(rows, 1):
              text.append(
                  f"Scene {i}: Pexels video "
                  f"{r.get('pexels_video_id')}"
              )
              text.append(
                  f"Photographer: "
                  f"{r.get('photographer', '')}"
              )
              text.append(
                  f"Source: "
                  f"{r.get('pexels_page', '')}"
              )
              text.append("")

          Path("output/credits.txt").write_text(
              "\n".join(text),
              encoding="utf-8"
          )

          caption = """Your actions might look good... but what really matters is WHY you did them.

          The reward of deeds depends upon the intentions, and every person will get the reward according to what they have intended.

          What will you make your intention for today? 🤍

          Sahih al-Bukhari 1
          Narrated by Umar ibn al-Khattab رضي الله عنه

          Footage: Pexels — https://www.pexels.com/

          #DeenInSec #Hadith #Islam #Sunnah #SahihBukhari #Reminder #IslamicReminder"""

          Path("output/caption.txt").write_text(
              caption,
              encoding="utf-8"
          )
          PY
      - name: Verify output
        run: |
          test -s output/deen-in-sec-hadith-001-v7.mp4

          echo "VIDEO:"
          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            output/deen-in-sec-hadith-001-v7.mp4

          echo "AUDIO:"
          ffprobe \
            -v error \
            -select_streams a:0 \
            -show_entries stream=codec_name \
            -of default=noprint_wrappers=1 \
            output/deen-in-sec-hadith-001-v7.mp4

          echo "DURATION:"
          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            output/deen-in-sec-hadith-001-v7.mp4

      - name: Upload Reel artifact
        uses: actions/upload-artifact@v4
        with:
          name: deen-in-sec-hadith-001-v7
          path: output/
          if-no-files-found: error
