      # ============================================================
      # 14. CREATE DYNAMIC SUBTITLE TIMINGS
      # ============================================================
      - name: Create subtitle timing file
        run: |
          python3 - <<'PY'
          import subprocess
          import json
          import os

          voice_dir = "work/voice"

          files = [
              "part1.wav",
              "pause_short.wav",
              "part2.wav",
              "pause_short.wav",
              "part3.wav",
              "pause_long.wav",
              "part4.wav",
              "pause_short.wav",
              "part5.wav",
              "pause_short.wav",
              "part6.wav",
              "pause_long.wav",
              "part7.wav"
          ]

          durations = []

          for name in files:
              path = os.path.join(voice_dir, name)

              result = subprocess.check_output([
                  "ffprobe",
                  "-v",
                  "error",
                  "-show_entries",
                  "format=duration",
                  "-of",
                  "default=noprint_wrappers=1:nokey=1",
                  path
              ])

              durations.append(float(result.decode().strip()))

          raw_total = sum(durations)

          final_audio = "work/audio/voice_final.wav"

          result = subprocess.check_output([
              "ffprobe",
              "-v",
              "error",
              "-show_entries",
              "format=duration",
              "-of",
              "default=noprint_wrappers=1:nokey=1",
              final_audio
          ])

          final_total = float(result.decode().strip())

          scale = final_total / raw_total

          print("Raw total:", raw_total)
          print("Final total:", final_total)
          print("Timing scale:", scale)

          # Speech lines correspond to these segment indexes.
          speech = {
              0: "Your actions might look good… but what really matters is WHY you did them.",
              2: "The Prophet Muhammad, peace and blessings be upon him, said:",
              4: "The reward of deeds depends upon the intentions, and every person will get the reward according to what they have intended.",
              6: "So before you do something, ask yourself… Why am I doing this?",
              8: "A small action with a sincere intention can have a huge reward.",
              10: "What will you make your intention for today?",
              12: "Sahih al-Bukhari 1. Narrated by Umar ibn al-Khattab."
          }

          current = 0.0
          entries = []

          for index, duration in enumerate(durations):
              start = current * scale
              end = (current + duration) * scale

              if index in speech:
                  entries.append({
                      "start": start,
                      "end": end,
                      "text": speech[index]
                  })

              current += duration

          with open("work/subtitles/timings.json", "w", encoding="utf-8") as f:
              json.dump(entries, f, ensure_ascii=False, indent=2)

          print(json.dumps(entries, ensure_ascii=False, indent=2))

          PY


      # ============================================================
      # 15. CREATE PREMIUM ASS SUBTITLES
      # ============================================================
      - name: Create premium subtitles
        run: |
          python3 - <<'PY'
          import json
          import re

          with open(
              "work/subtitles/timings.json",
              "r",
              encoding="utf-8"
          ) as f:
              entries = json.load(f)


          def ass_time(seconds):
              if seconds < 0:
                  seconds = 0

              h = int(seconds // 3600)
              m = int((seconds % 3600) // 60)
              s = int(seconds % 60)
              cs = int(round((seconds - int(seconds)) * 100))

              if cs >= 100:
                  cs = 0
                  s += 1

              if s >= 60:
                  s = 0
                  m += 1

              if m >= 60:
                  m = 0
                  h += 1

              return f"{h}:{m:02d}:{s:02d}.{cs:02d}"


          header = """[Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920
          WrapStyle: 2
          ScaledBorderAndShadow: yes

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Main,DejaVu Sans,62,&H00FFFFFF,&H00FFFFFF,&H00110C07,&H00000000,1,0,0,0,100,100,1,0,1,3,1,2,70,70,250,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          """

          lines = [header]

          for item in entries:
              start = ass_time(item["start"])
              end = ass_time(item["end"])
              text = item["text"]

              # Keep the hook visually stronger.
              if "WHY" in text:
                  text = text.replace(
                      "WHY",
                      r"{\c&H0055D9FF&}WHY{\c&H00FFFFFF&}"
                  )

              # Highlight the key Hadith concept.
              text = text.replace(
                  "intentions",
                  r"{\c&H0055D9FF&}intentions{\c&H00FFFFFF&}"
              )

              lines.append(
                  f"Dialogue: 0,{start},{end},Main,,0,0,0,,{text}"
              )

          with open(
              "work/subtitles/deen-in-sec.ass",
              "w",
              encoding="utf-8"
          ) as f:
              f.write("\n".join(lines))

          print("ASS subtitles created.")

          PY


