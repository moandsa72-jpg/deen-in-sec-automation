name: Deen in Sec - Create Reel

on:
  workflow_dispatch:

jobs:
  create-reel:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Install Piper TTS
        run: |
          python -m pip install --upgrade pip
          python -m pip install piper-tts

      - name: Create folders
        run: |
          mkdir -p work
          mkdir -p output

      # ==========================================
      # HADITH SCRIPT
      # ==========================================
      - name: Create voice script
        run: |
           

      # ==========================================
      # GENERATE AI VOICE
      # ==========================================
      - name: Generate voice
        run: |
          mkdir -p output
          python -m piper.download_voices en_US-lessac-medium
               echo "Your actions might look good, but what really matters is why you did them. The reward of deeds depends upon the intentions, and every person will get the reward according to what he has intended." | piper --model en_US-lessac-medium --output_file output/deen-in-sec-hadith-001.wav

      # ==========================================
      # CREATE CINEMATIC ISLAMIC BACKGROUND
      # ==========================================
      - name: Create cinematic background
        run: |
          ffmpeg -y \
            -f lavfi \
            -i "color=c=#07151b:s=1080x1920:r=30" \
            -t 45 \
            -vf "
              drawbox=x=0:y=0:w=1080:h=1920:color=#07151b@1:t=fill,
              drawbox=x=60:y=60:w=960:h=1800:color=#c9aa63@0.10:t=5,
              drawbox=x=110:y=110:w=860:h=1700:color=#c9aa63@0.06:t=3,

              drawbox=x=490:y=600:w=100:h=700:color=#020507@1:t=fill,
              drawbox=x=390:y=850:w=300:h=450:color=#020507@1:t=fill,

              drawbox=x=445:y=900:w=190:h=400:color=#07151b@1:t=fill,

              drawbox=x=190:y=500:w=5:h=800:color=#c9aa63@0.30:t=fill,
              drawbox=x=885:y=500:w=5:h=800:color=#c9aa63@0.30:t=fill,

              drawbox=x=270:y=700:w=540:h=5:color=#c9aa63@0.22:t=fill,

              drawtext=text='DEEN IN SEC':
                x=(w-text_w)/2:
                y=250:
                fontsize=48:
                fontcolor=#e7c77b:
                font=DejaVu Sans,

              drawtext=text='SINCERE INTENTION':
                x=(w-text_w)/2:
                y=1500:
                fontsize=42:
                fontcolor=white@0.65:
                font=DejaVu Sans
            " \
            -c:v libx264 \
            -preset veryfast \
            -crf 22 \
            -pix_fmt yuv420p \
            work/background.mp4

      # ==========================================
      # CREATE SUBTITLE FILE
      # ==========================================
      - name: Create subtitles
        run: |
          cat > work/subtitles.ass <<'EOF'
          [Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Default,DejaVu Sans,58,&H00FFFFFF,&H00FFFFFF,&H00101010,&H99000000,1,0,5,80,80,300,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text

          Dialogue: 0,0:00:00.00,0:00:04.50,Default,,0,0,0,,Your actions might look good...
          Dialogue: 0,0:00:04.50,0:00:08.50,Default,,0,0,0,,But what really matters is WHY you did them.

          Dialogue: 0,0:00:08.50,0:00:12.00,Default,,0,0,0,,The Prophet Muhammad ﷺ said:

          Dialogue: 0,0:00:12.00,0:00:18.50,Default,,0,0,0,,The reward of deeds depends upon the intentions,

          Dialogue: 0,0:00:18.50,0:00:24.00,Default,,0,0,0,,and every person will get the reward according to what they have intended.

          Dialogue: 0,0:00:24.00,0:00:28.50,Default,,0,0,0,,So before you do something, ask yourself:

          Dialogue: 0,0:00:28.50,0:00:31.50,Default,,0,0,0,,Why am I doing this?

          Dialogue: 0,0:00:31.50,0:00:36.00,Default,,0,0,0,,A small action with a sincere intention can have a huge reward.

          Dialogue: 0,0:00:36.00,0:00:41.00,Default,,0,0,0,,What will you make your intention for today? 💚

          EOF

      # ==========================================
      # ADD FADE + SUBTITLES + VOICE
      # ==========================================
      - name: Render final Reel
        run: |
          ffmpeg -y \
            -i work/background.mp4 \
            -i work/voice.wav \
            -filter_complex "
              [0:v]
              fade=t=in:st=0:d=1,
              fade=t=out:st=40:d=2,
              subtitles=work/subtitles.ass
              [video]
            " \
            -map "[video]" \
            -map 1:a \
            -shortest \
            -c:v libx264 \
            -preset medium \
            -crf 20 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 192k \
            -movflags +faststart \
            output/deen-in-sec-hadith-001.mp4

      # ==========================================
      # CHECK VIDEO
      # ==========================================
      - name: Check final Reel
        run: |
          echo "======================================"
          echo "DEEN IN SEC REEL CREATED SUCCESSFULLY"
          echo "======================================"

          ls -lh output/deen-in-sec-hadith-001.mp4

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=width,height,codec_name \
            -of default=noprint_wrappers=1 \
            output/deen-in-sec-hadith-001.mp4

      # ==========================================
      # UPLOAD VIDEO AS ARTIFACT
      # ==========================================
      - name: Upload Reel
        uses: actions/upload-artifact@v4
        with:
          name: deen-in-sec-hadith-001
          path: output/deen-in-sec-hadith-001.mp4
          retention-days: 7
