      # ============================================================
      # 17. CREATE PROFESSIONAL ASS SUBTITLES
      # ============================================================
      - name: Create subtitles
        run: |
          python3 - <<'PY'

          import os

          timing_file = "work/voice_timings.txt"

          timings = []

          with open(
              timing_file,
              "r"
          ) as f:

              for line in f:

                  parts = line.strip().split("|")

                  if len(parts) == 3:

                      number = int(parts[0])
                      start = float(parts[1])
                      end = float(parts[2])

                      timings.append(
                          (
                              number,
                              start,
                              end
                          )
                      )


          def ass_time(seconds):

              h = int(seconds // 3600)

              m = int(
                  (seconds % 3600)
                  // 60
              )

              s = seconds % 60

              cs = int(
                  round(
                      (s - int(s)) * 100
                  )
              )

              s = int(s)

              if cs >= 100:
                  s += 1
                  cs = 0

              return (
                  f"{h}:"
                  f"{m:02d}:"
                  f"{s:02d}."
                  f"{cs:02d}"
              )


          texts = {

              1:
              r"Your actions might look good..."
              r"\Nbut what really matters is "
              r"{\c&H00D7FF&}WHY{\c&HFFFFFF&} "
              r"you did them.",

              2:
              r"The Prophet Muhammad,"
              r"\Npeace and blessings be upon him, said:",

              3:
              r"The reward of deeds depends upon "
              r"the intentions,"
              r"\Nand every person will get the reward"
              r"\Naccording to what they have intended.",

              4:
              r"So before you do something..."
              r"\Nask yourself:"
              r"\N{\c&H00D7FF&}Why am I doing this?{\c&HFFFFFF&}",

              5:
              r"A small action with a sincere"
              r"\N{\c&H00D7FF&}intention{\c&HFFFFFF&}"
              r"\Ncan have a huge reward.",

              6:
              r"What will you make your"
              r"\N{\c&H00D7FF&}intention{\c&HFFFFFF&}"
              r" for today?",

              7:
              r"Sahih al-Bukhari 1"
              r"\N{\c&H00D7FF&}Narrated by Umar ibn al-Khattab{\c&HFFFFFF&}"
          }


          header = """[Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920
          WrapStyle: 2
          ScaledBorderAndShadow: yes

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Main,Liberation Sans,54,&H00FFFFFF,&H00FFFFFF,&H00141414,&H80000000,-1,0,0,0,100,100,1,0,1,2,1,2,70,70,300,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          """

          lines = [
              header
          ]

          for number, start, end in timings:

              if number not in texts:
                  continue

              lines.append(
                  "Dialogue: 0,"
                  + ass_time(start)
                  + ","
                  + ass_time(end)
                  + ",Main,,0,0,0,,"
                  + texts[number]
              )

          with open(
              "work/subtitles/hadith.ass",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  "\n".join(lines)
              )

          print(
              "Subtitle file created."
          )

          PY

