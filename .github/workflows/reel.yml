name: Deen in Sec - Create Reel

on:
  workflow_dispatch:

jobs:
  create-reel:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # INSTALL TOOLS
      # ==========================================
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow

      - name: Install Piper TTS
        run: |
          python3 -m pip install piper-tts

      # ==========================================
      # CREATE FOLDERS
      # ==========================================
      - name: Create folders
        run: |
          rm -rf work
          mkdir -p work
          mkdir -p work/images
          mkdir -p work/scenes
          mkdir -p output

      # ==========================================
      # CREATE CINEMATIC VISUALS
      # ==========================================
      - name: Create cinematic visual artwork
        run: |

          cat > work/create_visuals.py <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          import random
          import math

          W = 1080
          H = 1920

          GOLD = (205, 170, 95)
          GOLD2 = (235, 205, 135)
          WHITE = (235, 235, 230)

          random.seed(42)

          def gradient(top, bottom):
              img = Image.new("RGB", (W, H))
              px = img.load()

              for y in range(H):
                  t = y / (H - 1)

                  r = int(top[0] * (1-t) + bottom[0] * t)
                  g = int(top[1] * (1-t) + bottom[1] * t)
                  b = int(top[2] * (1-t) + bottom[2] * t)

                  for x in range(W):
                      px[x, y] = (r, g, b)

              return img

          def vignette(img):
              overlay = Image.new("RGBA", (W, H), (0,0,0,0))
              p = overlay.load()

              cx = W / 2
              cy = H / 2

              for y in range(H):
                  for x in range(W):
                      dx = (x-cx)/(W/2)
                      dy = (y-cy)/(H/2)

                      d = math.sqrt(dx*dx + dy*dy)

                      if d > 0.45:
                          alpha = int(min(190, (d-0.45)*260))
                          p[x,y] = (0,0,0,alpha)

              return Image.alpha_composite(img.convert("RGBA"), overlay).convert("RGB")

          def stars(img, amount=140):
              draw = ImageDraw.Draw(img)

              for _ in range(amount):
                  x = random.randint(30, W-30)
                  y = random.randint(30, 1250)

                  r = random.choice([1,1,1,2])

                  draw.ellipse(
                      (x-r,y-r,x+r,y+r),
                      fill=(225,215,180)
                  )

          def glow(img, xy, radius, color, alpha):
              layer = Image.new("RGBA", (W,H), (0,0,0,0))
              draw = ImageDraw.Draw(layer)

              x,y = xy

              for r in range(radius, 0, -15):
                  a = int(alpha * (r/radius)**2)

                  draw.ellipse(
                      (x-r,y-r,x+r,y+r),
                      fill=(*color,a)
                  )

              layer = layer.filter(ImageFilter.GaussianBlur(20))

              return Image.alpha_composite(
                  img.convert("RGBA"),
                  layer
              ).convert("RGB")

          def mosque_silhouette(img):
              draw = ImageDraw.Draw(img)

              base_y = 1510

              # main building
              draw.rectangle(
                  (180,1050,900,base_y),
                  fill=(8,13,16)
              )

              # central dome
              draw.ellipse(
                  (360,700,720,1120),
                  fill=(7,12,15)
              )

              draw.rectangle(
                  (360,900,720,1120),
                  fill=(7,12,15)
              )

              # dome tip
              draw.polygon(
                  [(540,650),(515,710),(565,710)],
                  fill=(7,12,15)
              )

              # left minaret
              draw.rectangle(
                  (210,650,280,1510),
                  fill=(6,11,14)
              )

              draw.ellipse(
                  (190,600,300,700),
                  fill=(6,11,14)
              )

              draw.polygon(
                  [(245,510),(205,610),(285,610)],
                  fill=(6,11,14)
              )

              # right minaret
              draw.rectangle(
                  (800,650,870,1510),
                  fill=(6,11,14)
              )

              draw.ellipse(
                  (780,600,890,700),
                  fill=(6,11,14)
              )

              draw.polygon(
                  [(835,510),(795,610),(875,610)],
                  fill=(6,11,14)
              )

              # arches
              for x in [270,390,510,630,750]:
                  draw.rectangle(
                      (x,1180,x+80,1510),
                      fill=(5,9,12)
                  )

                  draw.ellipse(
                      (x,1120,x+80,1240),
                      fill=(5,9,12)
                  )

              # golden windows
              for x in [295,415,535,655,775]:
                  draw.rectangle(
                      (x,1260,x+30,1390),
                      fill=(115,91,45)
                  )

          # ==========================================
          # SCENE 1 — MOSQUE AT NIGHT
          # ==========================================
          img = gradient(
              (4,12,20),
              (16,28,31)
          )

          img = glow(img,(540,800),420,GOLD,25)

          stars(img,170)
          mosque_silhouette(img)

          # subtle horizon
          draw = ImageDraw.Draw(img)

          draw.rectangle(
              (0,1510,W,H),
              fill=(4,8,10)
          )

          # golden horizon light
          for i in range(8):
              alpha = 30 - i*3
              draw.rectangle(
                  (0,1490+i*3,W,1493+i*3),
                  fill=(70,55,30)
              )

          img = vignette(img)

          img.save("work/images/scene1.png", quality=95)


          # ==========================================
          # SCENE 2 — BOOK / HADITH
          # ==========================================
          img = gradient(
              (8,14,20),
              (22,19,14)
          )

          img = glow(img,(540,780),500,GOLD,35)

          draw = ImageDraw.Draw(img)

          # table
          draw.rectangle(
              (0,1370,W,H),
              fill=(10,8,6)
          )

          # book shadow
          draw.rounded_rectangle(
              (190,920,890,1430),
              radius=40,
              fill=(2,3,4)
          )

          # left page
          draw.polygon(
              [(230,880),(535,960),(535,1370),(230,1280)],
              fill=(205,193,160)
          )

          # right page
          draw.polygon(
              [(545,960),(850,880),(850,1280),(545,1370)],
              fill=(224,211,177)
          )

          # book center
          draw.line(
              (540,955,540,1375),
              fill=(110,90,55),
              width=7
          )

          # page lines
          for i in range(7):
              y = 1010 + i*43

              draw.line(
                  (285,y,500,y+65),
                  fill=(125,108,76),
                  width=3
              )

              draw.line(
                  (580,y+65,800,y),
                  fill=(125,108,76),
                  width=3
              )

          # golden bookmark
          draw.polygon(
              [(535,950),(565,950),(565,1400),(550,1375),(535,1400)],
              fill=GOLD
          )

          img = vignette(img)

          img.save("work/images/scene2.png", quality=95)


          # ==========================================
          # SCENE 3 — NIGHT SKY / REFLECTION
          # ==========================================
          img = gradient(
              (3,8,18),
              (13,31,36)
          )

          stars(img,260)

          img = glow(img,(760,620),260,(210,190,130),25)

          draw = ImageDraw.Draw(img)

          # moon
          draw.ellipse(
              (720,380,880,540),
              fill=(220,211,180)
          )

          draw.ellipse(
              (680,350,840,510),
              fill=(5,12,22)
          )

          # mountains
          draw.polygon(
              [(0,1450),(240,1180),(430,1450),(650,1100),(1080,1500),(1080,H),(0,H)],
              fill=(5,12,15)
          )

          # reflection water
          for i in range(20):
              y = 1530 + i*18
              width = random.randint(100,500)
              x = random.randint(150,700)

              draw.line(
                  (x,y,x+width,y),
                  fill=(85,75,48),
                  width=random.randint(1,3)
              )

          img = vignette(img)

          img.save("work/images/scene3.png", quality=95)


          # ==========================================
          # SCENE 4 — MOSQUE INTERIOR
          # ==========================================
          img = gradient(
              (5,10,14),
              (22,18,12)
          )

          img = glow(img,(540,500),650,GOLD,35)

          draw = ImageDraw.Draw(img)

          # large central arch
          draw.polygon(
              [(180,1500),(180,850),(300,620),(540,520),(780,620),(900,850),(900,1500)],
              fill=(10,15,17)
          )

          # inner arch
          draw.polygon(
              [(280,1500),(280,900),(360,730),(540,650),(720,730),(800,900),(800,1500)],
              fill=(5,9,12)
          )

          # windows / light
          for x in [380,465,550,635]:
              draw.rectangle(
                  (x,760,x+35,1030),
                  fill=(100,83,48)
              )

          # floor
          draw.polygon(
              [(180,1500),(900,1500),(1080,H),(0,H)],
              fill=(9,10,9)
          )

          # prayer rug lines
          for i in range(8):
              y = 1550 + i*45

              draw.line(
                  (250,y,830,y),
                  fill=(55,47,31),
                  width=3
              )

          # rays
          ray = Image.new("RGBA",(W,H),(0,0,0,0))
          rd = ImageDraw.Draw(ray)

          rd.polygon(
              [(500,550),(580,550),(900,1450),(180,1450)],
              fill=(230,205,145,25)
          )

          ray = ray.filter(ImageFilter.GaussianBlur(25))

          img = Image.alpha_composite(
              img.convert("RGBA"),
              ray
          ).convert("RGB")

          img = vignette(img)

          img.save("work/images/scene4.png", quality=95)


          # ==========================================
          # SCENE 5 — DAWN / CLOSING
          # ==========================================
          img = gradient(
              (7,15,24),
              (48,38,25)
          )

          img = glow(img,(540,1150),520,GOLD,40)

          draw = ImageDraw.Draw(img)

          # dawn horizon
          for y in range(1120,1500):
              t=(y-1120)/380
              r=int(35+80*t)
              g=int(28+65*t)
              b=int(20+35*t)

              draw.line(
                  (0,y,W,y),
                  fill=(r,g,b)
              )

          # sun
          draw.ellipse(
              (430,980,650,1200),
              fill=(225,190,110)
          )

          # foreground
          draw.polygon(
              [(0,1460),(260,1350),(500,1450),(720,1320),(1080,1450),(1080,H),(0,H)],
              fill=(5,9,11)
          )

          # mosque silhouette
          mosque_silhouette(img)

          img = vignette(img)

          img.save("work/images/scene5.png", quality=95)

          print("ALL CINEMATIC VISUALS CREATED")

          PY

          python3 work/create_visuals.py

          ls -lh work/images/


      # ==========================================
      # VOICE SCRIPT
      # ==========================================
      - name: Create voice script
        run: |
          cat > work/script.txt <<'EOF'
          Your actions might look good...
          but what really matters is WHY you did them.

          The Prophet Muhammad, peace and blessings be upon him, said:

          The reward of deeds depends upon the intentions,
          and every person will get the reward according to what they have intended.

          So before you act, ask yourself:

          Why am I doing this?

          A sincere intention can turn a small action into a great reward.

          What will you make your intention for today?

          Sahih al-Bukhari 1.
          Narrated by Umar ibn al-Khattab.
          EOF


      # ==========================================
      # GENERATE CALM MALE VOICE
      # ==========================================
      - name: Generate male voice
        run: |
          python3 -m piper.download_voices en_US-hfc_male-medium

          cat work/script.txt | \
          piper \
            --model en_US-hfc_male-medium \
            --output_file work/voice_raw.wav

          ffmpeg -y \
            -i work/voice_raw.wav \
            -filter:a "atempo=0.94" \
            work/voice.wav

          echo "VOICE CREATED"

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            work/voice.wav


      # ==========================================
      # CREATE ANIMATED SCENE 1
      # ==========================================
      - name: Animate scene 1
        run: |
          ffmpeg -y \
            -loop 1 \
            -i work/images/scene1.png \
            -t 8 \
            -vf "
              zoompan=z='min(zoom+0.0007,1.08)':d=240:s=1080x1920:fps=30,
              format=yuv420p,
              noise=alls=8:allf=t+u,
              vignette
            " \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -pix_fmt yuv420p \
            work/scenes/scene1.mp4


      # ==========================================
      # CREATE ANIMATED SCENE 2
      # ==========================================
      - name: Animate scene 2
        run: |
          ffmpeg -y \
            -loop 1 \
            -i work/images/scene2.png \
            -t 8 \
            -vf "
              zoompan=z='min(zoom+0.0005,1.07)':d=240:s=1080x1920:fps=30,
              format=yuv420p,
              noise=alls=7:allf=t+u,
              vignette
            " \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -pix_fmt yuv420p \
            work/scenes/scene2.mp4


      # ==========================================
      # CREATE ANIMATED SCENE 3
      # ==========================================
      - name: Animate scene 3
        run: |
          ffmpeg -y \
            -loop 1 \
            -i work/images/scene3.png \
            -t 8 \
            -vf "
              zoompan=z='min(zoom+0.0006,1.075)':d=240:s=1080x1920:fps=30,
              format=yuv420p,
              noise=alls=8:allf=t+u,
              vignette
            " \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -pix_fmt yuv420p \
            work/scenes/scene3.mp4


      # ==========================================
      # CREATE ANIMATED SCENE 4
      # ==========================================
      - name: Animate scene 4
        run: |
          ffmpeg -y \
            -loop 1 \
            -i work/images/scene4.png \
            -t 8 \
            -vf "
              zoompan=z='min(zoom+0.0005,1.07)':d=240:s=1080x1920:fps=30,
              format=yuv420p,
              noise=alls=7:allf=t+u,
              vignette
            " \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -pix_fmt yuv420p \
            work/scenes/scene4.mp4


      # ==========================================
      # CREATE ANIMATED SCENE 5
      # ==========================================
      - name: Animate scene 5
        run: |
          ffmpeg -y \
            -loop 1 \
            -i work/images/scene5.png \
            -t 8 \
            -vf "
              zoompan=z='min(zoom+0.0004,1.06)':d=240:s=1080x1920:fps=30,
              format=yuv420p,
              noise=alls=7:allf=t+u,
              vignette
            " \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -pix_fmt yuv420p \
            work/scenes/scene5.mp4


      # ==========================================
      # JOIN SCENES
      # ==========================================
      - name: Join cinematic scenes
        run: |
          cat > work/scenes.txt <<'EOF'
          file 'scenes/scene1.mp4'
          file 'scenes/scene2.mp4'
          file 'scenes/scene3.mp4'
          file 'scenes/scene4.mp4'
          file 'scenes/scene5.mp4'
          EOF

          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i work/scenes.txt \
            -c copy \
            work/background.mp4

          echo "BACKGROUND CREATED"

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            work/background.mp4


      # ==========================================
      # CREATE SUBTITLES
      # ==========================================
      - name: Create subtitles
        run: |
          cat > work/subtitles.ass <<'EOF'
          [Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Main,DejaVu Sans,62,&H00FFFFFF,&H00FFFFFF,&H00120E08,&HAA000000,1,0,5,130,130,430,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text

          Dialogue: 0,0:00:00.00,0:00:03.50,Main,,0,0,0,,YOUR ACTIONS MIGHT LOOK GOOD...
          Dialogue: 0,0:00:03.50,0:00:07.50,Main,,0,0,0,,BUT WHAT REALLY MATTERS IS WHY YOU DID THEM.

          Dialogue: 0,0:00:07.50,0:00:11.50,Main,,0,0,0,,The Prophet Muhammad, peace and blessings be upon him, said:

          Dialogue: 0,0:00:11.50,0:00:17.00,Main,,0,0,0,,The reward of deeds depends upon the intentions,

          Dialogue: 0,0:00:17.00,0:00:23.00,Main,,0,0,0,,and every person will get the reward according to what they have intended.

          Dialogue: 0,0:00:23.00,0:00:27.00,Main,,0,0,0,,So before you act, ask yourself:

          Dialogue: 0,0:00:27.00,0:00:29.80,Main,,0,0,0,,WHY AM I DOING THIS?

          Dialogue: 0,0:00:29.80,0:00:35.00,Main,,0,0,0,,A sincere intention can turn a small action into a great reward.

          Dialogue: 0,0:00:35.00,0:00:38.00,Main,,0,0,0,,WHAT WILL YOU MAKE YOUR INTENTION FOR TODAY?

          Dialogue: 0,0:00:38.00,0:00:40.00,Main,,0,0,0,,SAHIH AL-BUKHARI 1 • UMAR IBN AL-KHATTAB

          EOF


      # ==========================================
      # RENDER FINAL REEL
      # ==========================================
      - name: Render final Reel
        run: |
          ffmpeg -y \
            -i work/background.mp4 \
            -i work/voice.wav \
            -filter_complex "
              [0:v]
              fade=t=in:st=0:d=1,
              fade=t=out:st=38:d=2,
              subtitles=work/subtitles.ass
              [video]
            " \
            -map "[video]" \
            -map 1:a \
            -t 40 \
            -
