name: Deen in Sec - Create Reel

on:
  workflow_dispatch:

jobs:
  create-reel:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # INSTALL TOOLS
      # ==========================================
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Install Piper TTS
        run: |
          python -m pip install --upgrade pip
          python -m pip install piper-tts

      # ==========================================
      # CREATE FOLDERS
      # ==========================================
      - name: Create folders
        run: |
          rm -rf work
          mkdir -p work
          mkdir -p work/scenes
          mkdir -p output

      # ==========================================
      # VOICE SCRIPT
      # ==========================================
      - name: Create voice script
        run: |
          cat > work/script.txt <<'EOF'
          Your actions might look good...
             but what really matters is WHY you did them.
          

          The Prophet Muhammad, peace and blessings be upon him, said:

          The reward of deeds depends upon the intentions,
          and every person will get the reward according to what they have intended.

          So before you do something, ask yourself:

          Why am I doing this?

          A small action with a sincere intention can have a huge reward.

          What will you make your intention for today?

          Sahih al-Bukhari 1.
          Narrated by Umar ibn al-Khattab, may Allah be pleased with him.

          
          
          
          

      # ==========================================
      # GENERATE DEEP MALE AI VOICE
      # ==========================================
      - name: Generate male voice
        run: |
          python -m piper.download_voices en_US-hfc_male-medium

          cat work/script.txt | \
          piper \
            --model en_US-ryan-high \
            --output_file work/voice.wav

            ffmpeg -y \
            -i work/voice.wav \
            -filter:a "atempo=0.94" \
            work/voice-slow.wav
            mv work/voice-slow.wav work/voice.wav
          
            
            

          echo "VOICE CREATED"
          ls -lh work/voice.wav

      # ==========================================
      # CREATE CINEMATIC SCENE 1
      # ==========================================
      - name: Create cinematic scene 1
        run: |
          ffmpeg -y \
            -f lavfi \
            -i "color=c=#050b12:s=1080x1920:r=30" \
            -t 7 \
            -vf "
              drawbox=x=0:y=0:w=1080:h=1920:color=#050b12@1:t=fill,
              drawbox=x=70:y=70:w=940:h=1780:color=#c9aa63@0.15:t=4,
              drawbox=x=150:y=150:w=780:h=1620:color=#c9aa63@0.06:t=3,
              drawbox=x=440:y=650:w=200:h=700:color=#000000@0.9:t=fill,
              drawbox=x=350:y=850:w=380:h=500:color=#000000@0.9:t=fill,
              drawbox=x=470:y=500:w=140:h=150:color=#000000@0.9:t=fill,
              drawtext=text='A GOOD DEED':x=(w-text_w)/2:y=260:fontsize=72:fontcolor=#e7c77b:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
              drawtext=text='CAN STILL BE LOST':x=(w-text_w)/2:y=350:fontsize=54:fontcolor=white:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
            " \
            -c:v libx264 \
            -preset veryfast \
            -crf 22 \
            -pix_fmt yuv420p \
            work/scenes/scene1.mp4

      # ==========================================
      # CREATE CINEMATIC SCENE 2
      # ==========================================
      - name: Create cinematic scene 2
        run: |
          ffmpeg -y \
            -f lavfi \
            -i "color=c=#07151b:s=1080x1920:r=30" \
            -t 8 \
            -vf "
              drawbox=x=0:y=0:w=1080:h=1920:color=#07151b@1:t=fill,
              drawbox=x=120:y=400:w=840:h=1100:color=#c9aa63@0.07:t=fill,
              drawbox=x=250:y=650:w=580:h=700:color=#020507@0.9:t=fill,
              drawbox=x=360:y=820:w=360:h=530:color=#020507@1:t=fill,
              drawbox=x=430:y=760:w=220:h=70:color=#c9aa63@0.25:t=fill,
              drawbox=x=430:y=900:w=220:h=12:color=#c9aa63@0.35:t=fill,
              drawbox=x=430:y=1000:w=220:h=12:color=#c9aa63@0.35:t=fill,
              drawbox=x=430:y=1100:w=220:h=12:color=#c9aa63@0.35:t=fill,
              drawtext=text='THE REWARD':x=(w-text_w)/2:y=250:fontsize=70:fontcolor=#e7c77b:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
              drawtext=text='DEPENDS ON':x=(w-text_w)/2:y=340:fontsize=58:fontcolor=white:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
              drawtext=text='THE INTENTION':x=(w-text_w)/2:y=420:fontsize=58:fontcolor=white:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
            " \
            -c:v libx264 \
            -preset veryfast \
            -crf 22 \
            -pix_fmt yuv420p \
            work/scenes/scene2.mp4

      # ==========================================
      # CREATE CINEMATIC SCENE 3
      # ==========================================
      - name: Create cinematic scene 3
        run: |
          ffmpeg -y \
            -f lavfi \
            -i "color=c=#03080d:s=1080x1920:r=30" \
            -t 8 \
            -vf "
              drawbox=x=0:y=0:w=1080:h=1920:color=#03080d@1:t=fill,
              drawbox=x=100:y=100:w=880:h=1720:color=#c9aa63@0.10:t=3,
              drawbox=x=190:y=420:w=700:h=1150:color=#0c2028@1:t=fill,
              drawbox=x=280:y=600:w=520:h=850:color=#020507@0.9:t=fill,
              drawbox=x=330:y=700:w=420:h=80:color=#c9aa63@0.18:t=fill,
              drawbox=x=330:y=850:w=420:h=14:color=#c9aa63@0.28:t=fill,
              drawbox=x=330:y=960:w=420:h=14:color=#c9aa63@0.28:t=fill,
              drawbox=x=330:y=1070:w=420:h=14:color=#c9aa63@0.28:t=fill,
              drawbox=x=330:y=1180:w=420:h=14:color=#c9aa63@0.28:t=fill,
              drawtext=text='WHY AM I':x=(w-text_w)/2:y=250:fontsize=72:fontcolor=#e7c77b:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
              drawtext=text='DOING THIS?':x=(w-text_w)/2:y=350:fontsize=72:fontcolor=white:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
            " \
            -c:v libx264 \
            -preset veryfast \
            -crf 22 \
            -pix_fmt yuv420p \
            work/scenes/scene3.mp4

      # ==========================================
      # CREATE CINEMATIC SCENE 4
      # ==========================================
      - name: Create cinematic scene 4
        run: |
          ffmpeg -y \
            -f lavfi \
            -i "color=c=#061018:s=1080x1920:r=30" \
            -t 8 \
            -vf "
              drawbox=x=0:y=0:w=1080:h=1920:color=#061018@1:t=fill,
              drawbox=x=80:y=80:w=920:h=1760:color=#c9aa63@0.12:t=4,
              drawbox=x=540:y=300:w=6:h=1300:color=#c9aa63@0.20:t=fill,
              drawbox=x=250:y=850:w=580:h=8:color=#c9aa63@0.30:t=fill,
              drawbox=x=350:y=700:w=380:h=300:color=#020507@0.75:t=fill,
              drawtext=text='SINCERE':x=(w-text_w)/2:y=300:fontsize=82:fontcolor=#e7c77b:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
              drawtext=text='INTENTION':x=(w-text_w)/2:y=400:fontsize=82:fontcolor=white:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
              drawtext=text='CAN CHANGE EVERYTHING':x=(w-text_w)/2:y=1450:fontsize=42:fontcolor=white@0.70:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
            " \
            -c:v libx264 \
            -preset veryfast \
            -crf 22 \
            -pix_fmt yuv420p \
            work/scenes/scene4.mp4

      # ==========================================
      # CREATE CINEMATIC SCENE 5
      # ==========================================
      - name: Create cinematic scene 5
        run: |
          ffmpeg -y \
            -f lavfi \
            -i "color=c=#02060a:s=1080x1920:r=30" \
            -t 9 \
            -vf "
              drawbox=x=0:y=0:w=1080:h=1920:color=#02060a@1:t=fill,
              drawbox=x=80:y=80:w=920:h=1760:color=#c9aa63@0.16:t=4,
              drawbox=x=170:y=170:w=740:h=1580:color=#c9aa63@0.05:t=3,
              drawbox=x=390:y=680:w=300:h=700:color=#020507@0.8:t=fill,
              drawbox=x=330:y=880:w=420:h=450:color=#020507@0.9:t=fill,
              drawtext=text='BEFORE YOUR':x=(w-text_w)/2:y=250:fontsize=62:fontcolor=white:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
              drawtext=text='NEXT GOOD DEED':x=(w-text_w)/2:y=350:fontsize=68:fontcolor=#e7c77b:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
              drawtext=text='CHECK YOUR INTENTION':x=(w-text_w)/2:y=1480:fontsize=46:fontcolor=white:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
              drawtext=text='DEEN IN SEC':x=(w-text_w)/2:y=1580:fontsize=40:fontcolor=#e7c77b:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
            " \
            -c:v libx264 \
            -preset veryfast \
            -crf 22 \
            -pix_fmt yuv420p \
            work/scenes/scene5.mp4

      # ==========================================
      # JOIN CINEMATIC SCENES
      # ==========================================
      - name: Join cinematic scenes
        run: |
          cat > work/scenes.txt <<'EOF'
          file 'scenes/scene1.mp4'
          file 'scenes/scene2.mp4'
          file 'scenes/scene3.mp4'
          file 'scenes/scene4.mp4'
          file 'scenes/scene5.mp4'
          EOF

          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i work/scenes.txt \
            -c copy \
            work/background.mp4

          echo "CINEMATIC BACKGROUND CREATED"
          ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            work/background.mp4

      # ==========================================
      # CREATE SUBTITLES
      # ==========================================
      - name: Create subtitles
        run: |
          cat > work/subtitles.ass <<'EOF'
          [Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Main,DejaVu Sans,62,&H00FFFFFF,&H00FFFFFF,&H00000000,&HAA000000,1,0,5,140,140,420,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text

          Dialogue: 0,0:00:00.00,0:00:03.50,Main,,0,0,0,,YOUR ACTIONS MIGHT LOOK GOOD...
          Dialogue: 0,0:00:03.50,0:00:07.00,Main,,0,0,0,,BUT WHAT REALLY MATTERS IS WHY YOU DID THEM.
          

          Dialogue: 0,0:00:07.00,0:00:11.50,Main,,0,0,0,,The Prophet Muhammad ﷺ said:

          Dialogue: 0,0:00:11.50,0:00:17.00,Main,,0,0,0,,The reward of deeds depends upon the intentions,

          Dialogue: 0,0:00:17.00,0:00:23.00,Main,,0,0,0,,and every person will get the reward according to what they have intended.

          Dialogue: 0,0:00:23.00,0:00:27.50,Main,,0,0,0,,So before you do something, ask yourself:

          Dialogue: 0,0:00:27.50,0:00:31.00,Main,,0,0,0,,WHY AM I DOING THIS?

          Dialogue: 0,0:00:31.00,0:00:36.00,Main,,0,0,0,,A small action with a sincere intention can have a huge reward.

          Dialogue: 0,0:00:32.00,0:00:36.00,Main,,0,0,0,,WHAT WILL YOU MAKE YOUR INTENTION FOR TODAY? 🤍
          Dialogue: 0,0:00:36.00,0:00:40.00,Main,,0,0,0,,SAHIH AL-BUKHARI 1 • UMAR IBN AL-KHATTAB

          EOF

      # ==========================================
      # RENDER FINAL REEL
      # ==========================================
      - name: Render final Reel
        run: |
          ffmpeg -y \
            -i work/background.mp4 \
            -i work/voice.wav \
            -filter_complex "
              [0:v]
              fade=t=in:st=0:d=0.8,
              fade=t=out:st=38:d=2,
              subtitles=work/subtitles.ass
              [video]
            " \
            -map "[video]" \
            -map 1:a \
            -shortest \
            -c:v libx264 \
            -preset medium \
            -crf 20 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 192k \
            -movflags +faststart \
            output/deen-in-sec-hadith-001.mp4

      # ==========================================
      # CHECK VIDEO
      # ==========================================
      - name: Check final Reel
        run: |
          echo "======================================"
          echo "DEEN IN SEC REEL CREATED SUCCESSFULLY"
          echo "======================================"

          ls -lh output/deen-in-sec-hadith-001.mp4

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=width,height,codec_name \
            -of default=noprint_wrappers=1 \
            output/deen-in-sec-hadith-001.mp4

      # ==========================================
      # UPLOAD REEL
      # ==========================================
      - name: Upload Reel
        uses: actions/upload-artifact@v4
        with:
          name: deen-in-sec-hadith-001
          path: output/deen-in-sec-hadith-001.mp4
          retention-days: 7
