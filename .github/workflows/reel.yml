name: Deen in Sec - Create Reel

on:
  workflow_dispatch:

jobs:
  create-reel:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # INSTALL TOOLS
      # ==========================================
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow


      - name: Install Piper TTS
        run: |
          python3 -m pip install piper-tts


      # ==========================================
      # CREATE FOLDERS
      # ==========================================
      - name: Create folders
        run: |
          rm -rf work
          mkdir -p work
          mkdir -p work/images
          mkdir -p work/scenes
          mkdir -p output


      # ==========================================
      # CREATE CINEMATIC VISUALS
      # ==========================================
      - name: Create cinematic visual artwork
        run: |

          cat > work/create_visuals.py <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          import random
          import math

          W = 1080
          H = 1920

          GOLD = (205, 170, 95)

          random.seed(42)

          def gradient(top, bottom):
              img = Image.new("RGB", (W, H))
              draw = ImageDraw.Draw(img)

              for y in range(H):
                  t = y / (H - 1)

                  r = int(top[0] * (1-t) + bottom[0] * t)
                  g = int(top[1] * (1-t) + bottom[1] * t)
                  b = int(top[2] * (1-t) + bottom[2] * t)

                  draw.line(
                      (0, y, W, y),
                      fill=(r, g, b)
                  )

              return img


          def vignette(img):
              overlay = Image.new("RGBA", (W, H), (0,0,0,0))
              draw = ImageDraw.Draw(overlay)

              cx = W / 2
              cy = H / 2

              for y in range(0, H, 8):
                  for x in range(0, W, 8):

                      dx = (x-cx)/(W/2)
                      dy = (y-cy)/(H/2)

                      d = math.sqrt(dx*dx + dy*dy)

                      if d > 0.45:
                          alpha = int(min(180, (d-0.45)*230))

                          draw.rectangle(
                              (x,y,x+8,y+8),
                              fill=(0,0,0,alpha)
                          )

              return Image.alpha_composite(
                  img.convert("RGBA"),
                  overlay
              ).convert("RGB")


          def stars(img, amount=180):
              draw = ImageDraw.Draw(img)

              for _ in range(amount):
                  x = random.randint(20, W-20)
                  y = random.randint(20, 1250)
                  r = random.choice([1,1,1,2])

                  draw.ellipse(
                      (x-r,y-r,x+r,y+r),
                      fill=(225,215,180)
                  )


          def glow(img, xy, radius, color, alpha):
              layer = Image.new(
                  "RGBA",
                  (W,H),
                  (0,0,0,0)
              )

              draw = ImageDraw.Draw(layer)

              x,y = xy

              draw.ellipse(
                  (x-radius,y-radius,x+radius,y+radius),
                  fill=(*color,alpha)
              )

              layer = layer.filter(
                  ImageFilter.GaussianBlur(radius//3)
              )

              return Image.alpha_composite(
                  img.convert("RGBA"),
                  layer
              ).convert("RGB")


          def mosque(img):
              draw = ImageDraw.Draw(img)

              base = 1530

              # Main building
              draw.rectangle(
                  (160,1050,920,base),
                  fill=(5,9,12)
              )

              # Dome
              draw.ellipse(
                  (350,690,730,1120),
                  fill=(5,9,12)
              )

              draw.rectangle(
                  (350,880,730,1120),
                  fill=(5,9,12)
              )

              # Dome point
              draw.polygon(
                  [(540,625),(510,700),(570,700)],
                  fill=(5,9,12)
              )

              # Minarets
              for cx in [235,845]:

                  draw.rectangle(
                      (cx-35,650,cx+35,1530),
                      fill=(4,8,11)
                  )

                  draw.ellipse(
                      (cx-55,590,cx+55,700),
                      fill=(4,8,11)
                  )

                  draw.polygon(
                      [
                          (cx,500),
                          (cx-40,610),
                          (cx+40,610)
                      ],
                      fill=(4,8,11)
                  )

              # Arches
              for x in [260,380,500,620,740]:

                  draw.rectangle(
                      (x,1180,x+75,1530),
                      fill=(3,7,10)
                  )

                  draw.ellipse(
                      (x,1110,x+75,1240),
                      fill=(3,7,10)
                  )

              # Windows
              for x in [285,405,525,645,765]:

                  draw.rectangle(
                      (x,1260,x+28,1400),
                      fill=(105,82,40)
                  )


          # ==========================================
          # SCENE 1
          # ==========================================

          img = gradient(
              (3,10,18),
              (13,25,30)
          )

          img = glow(
              img,
              (540,760),
              500,
              GOLD,
              32
          )

          stars(img,220)
          mosque(img)

          img = vignette(img)

          img.save(
              "work/images/scene1.png",
              quality=95
          )


          # ==========================================
          # SCENE 2 — HADITH BOOK
          # ==========================================

          img = gradient(
              (5,11,18),
              (24,19,13)
          )

          img = glow(
              img,
              (540,760),
              520,
              GOLD,
              38
          )

          draw = ImageDraw.Draw(img)

          # Table
          draw.rectangle(
              (0,1370,W,H),
              fill=(8,7,6)
          )

          # Shadow
          draw.rounded_rectangle(
              (160,900,920,1450),
              radius=45,
              fill=(1,2,3)
          )

          # Left page
          draw.polygon(
              [
                  (210,870),
                  (535,960),
                  (535,1375),
                  (210,1280)
              ],
              fill=(205,191,155)
          )

          # Right page
          draw.polygon(
              [
                  (545,960),
                  (870,870),
                  (870,1280),
                  (545,1375)
              ],
              fill=(224,211,176)
          )

          # Center
          draw.line(
              (540,950,540,1380),
              fill=(110,88,50),
              width=7
          )

          # Page writing
          for i in range(7):

              y = 1010 + i*45

              draw.line(
                  (275,y,495,y+60),
                  fill=(120,102,70),
                  width=3
              )

              draw.line(
                  (585,y+60,805,y),
                  fill=(120,102,70),
                  width=3
              )

          # Bookmark
          draw.polygon(
              [
                  (530,950),
                  (565,950),
                  (565,1405),
                  (548,1380),
                  (530,1405)
              ],
              fill=GOLD
          )

          img = vignette(img)

          img.save(
              "work/images/scene2.png",
              quality=95
          )


          # ==========================================
          # SCENE 3 — NIGHT / MOON / LANDSCAPE
          # ==========================================

          img = gradient(
              (2,7,17),
              (12,29,36)
          )

          stars(img,300)

          img = glow(
              img,
              (790,430),
              300,
              (220,200,145),
              35
          )

          draw = ImageDraw.Draw(img)

          # Moon
          draw.ellipse(
              (700,340,870,510),
              fill=(220,211,180)
          )

          draw.ellipse(
              (665,315,835,485),
              fill=(3,9,18)
          )

          # Mountains
          draw.polygon(
              [
                  (0,1450),
                  (250,1160),
                  (470,1450),
                  (690,1110),
                  (1080,1500),
                  (1080,H),
                  (0,H)
              ],
              fill=(4,11,15)
          )

          # Water
          for i in range(22):

              y = 1530 + i*17

              x = random.randint(100,700)
              width = random.randint(120,500)

              draw.line(
                  (x,y,x+width,y),
                  fill=(75,67,45),
                  width=random.randint(1,3)
              )

          img = vignette(img)

          img.save(
              "work/images/scene3.png",
              quality=95
          )


          # ==========================================
          # SCENE 4 — MOSQUE INTERIOR
          # ==========================================

          img = gradient(
              (4,9,14),
              (23,18,12)
          )

          img = glow(
              img,
              (540,500),
              650,
              GOLD,
              40
          )

          draw = ImageDraw.Draw(img)

          # Outer arch
          draw.polygon(
              [
                  (150,1500),
                  (150,850),
                  (280,620),
                  (540,500),
                  (800,620),
                  (930,850),
                  (930,1500)
              ],
              fill=(9,14,17)
          )

          # Inner arch
          draw.polygon(
              [
                  (270,1500),
                  (270,900),
                  (360,730),
                  (540,640),
                  (720,730),
                  (810,900),
                  (810,1500)
              ],
              fill=(4,8,11)
          )

          # Windows
          for x in [380,465,550,635]:

              draw.rectangle(
                  (x,760,x+35,1050),
                  fill=(105,83,48)
              )

          # Floor
          draw.polygon(
              [
                  (150,1500),
                  (930,1500),
                  (1080,H),
                  (0,H)
              ],
              fill=(7,9,9)
          )

          # Floor lines
          for i in range(9):

              y = 1540 + i*45

              draw.line(
                  (230,y,850,y),
                  fill=(50,43,30),
                  width=3
              )

          # Light rays
          rays = Image.new(
              "RGBA",
              (W,H),
              (0,0,0,0)
          )

          rd = ImageDraw.Draw(rays)

          rd.polygon(
              [
                  (480,550),
                  (600,550),
                  (950,1450),
                  (130,1450)
              ],
              fill=(235,205,140,25)
          )

          rays = rays.filter(
              ImageFilter.GaussianBlur(35)
          )

          img = Image.alpha_composite(
              img.convert("RGBA"),
              rays
          ).convert("RGB")

          img = vignette(img)

          img.save(
              "work/images/scene4.png",
              quality=95
          )


          # ==========================================
          # SCENE 5 — DAWN
          # ==========================================

          img = gradient(
              (5,13,23),
              (55,39,23)
          )

          img = glow(
              img,
              (540,1100),
              550,
              GOLD,
              45
          )

          draw = ImageDraw.Draw(img)

          # Horizon
          for y in range(1050,1500):

              t = (y-1050)/450

              r = int(35+75*t)
              g = int(27+58*t)
              b = int(19+35*t)

              draw.line(
                  (0,y,W,y),
                  fill=(r,g,b)
              )

          # Sun
          draw.ellipse(
              (430,960,650,1180),
              fill=(225,190,110)
          )

          # Foreground
          draw.polygon(
              [
                  (0,1480),
                  (250,1340),
                  (500,1450),
                  (720,1320),
                  (1080,1450),
                  (1080,H),
                  (0,H)
              ],
              fill=(4,8,10)
          )

          mosque(img)

          img = vignette(img)

          img.save(
              "work/images/scene5.png",
              quality=95
          )

          print("CINEMATIC ARTWORK CREATED")

          PY

          python3 work/create_visuals.py


      # ==========================================
      # VOICE SEGMENTS
      # ==========================================
      - name: Create voice segments
        run: |

          cat > work/part1.txt <<'EOF'
          Your actions might look good...
          but what really matters is WHY you did them.
          EOF

          cat > work/part2.txt <<'EOF'
          The Prophet Muhammad, peace and blessings be upon him, said:
          EOF

          cat > work/part3.txt <<'EOF'
          The reward of deeds depends upon the intentions,
          and every person will get the reward according to what they have intended.
          EOF

          cat > work/part4.txt <<'EOF'
          So before you act, ask yourself...
          Why am I doing this?
          EOF

          cat > work/part5.txt <<'EOF'
          A sincere intention can turn a small action into a great reward.
          EOF

          cat > work/part6.txt <<'EOF'
          What will you make your intention for today?
          EOF

          cat > work/part7.txt <<'EOF'
          Sahih al-Bukhari 1.
          Narrated by Umar ibn al-Khattab.
          EOF

          for i in 1 2 3 4 5 6 7
          do
            python3 -m piper.download_voices en_US-hfc_male-medium

            cat work/part$i.txt | \
            piper \
              --model en_US-hfc_male-medium \
              --output_file work/raw$i.wav

            ffmpeg -y \
              -i work/raw$i.wav \
              -filter:a "atempo=0.90" \
              work/part$i.wav
          done


      # ==========================================
      # ADD NATURAL PAUSES
      # ==========================================
      - name: Build final voice
        run: |

          ffmpeg -y \
            -i work/part1.wav \
            -i work/part2.wav \
            -i work/part3.wav \
            -i work/part4.wav \
            -i work/part5.wav \
            -i work/part6.wav \
            -i work/part7.wav \
            -filter_complex "
              anullsrc=r=22050:cl=mono:d=0.8[s1];
              anullsrc=r=22050:cl=mono:d=0.6[s2];
              anullsrc=r=22050:cl=mono:d=0.9[s3];
              anullsrc=r=22050:cl=mono:d=0.8[s4];
              anullsrc=r=22050:cl=mono:d=0.8[s5];
              anullsrc=r=22050:cl=mono:d=0.7[s6];

              [0:a][s1][1:a][s2][2:a][s3][3:a][s4][4:a][s5][5:a][s6][6:a]
              concat=n=13:v=0:a=1
              [voice]
            " \
            -map "[voice]" \
            -c:a pcm_s16le \
            work/voice.wav

          echo "FINAL VOICE CREATED"

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            work/voice.wav


      # ==========================================
      # ANIMATE SCENE 1
      # ==========================================
      - name: Animate scene 1
        run: |
          ffmpeg -y \
            -loop 1 \
            -i work/images/scene1.png \
            -t 8 \
            -vf "zoompan=z='min(zoom+0.0007,1.08)':d=240:s=1080x1920:fps=30,format=yuv420p" \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -pix_fmt yuv420p \
            work/scenes/scene1.mp4


      # ==========================================
      # ANIMATE SCENE 2
      # ==========================================
      - name: Animate scene 2
        run: |
          ffmpeg -y \
            -loop 1 \
            -i work/images/scene2.png \
            -t 8 \
            -vf "zoompan=z='min(zoom+0.0005,1.07)':d=240:s=1080x1920:fps=30,format=yuv420p" \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -pix_fmt yuv420p \
            work/scenes/scene2.mp4


      # ==========================================
      # ANIMATE SCENE 3
      # ==========================================
      - name: Animate scene 3
        run: |
          ffmpeg -y \
            -loop 1 \
            -i work/images/scene3.png \
            -t 8 \
            -vf "zoompan=z='min(zoom+0.0006,1.075)':d=240:s=1080x1920:fps=30,format=yuv420p" \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -pix_fmt yuv420p \
            work/scenes/scene3.mp4


      # ==========================================
      # ANIMATE SCENE 4
      # ==========================================
      - name: Animate scene 4
        run: |
          ffmpeg -y \
            -loop 1 \
            -i work/images/scene4.png \
            -t 8 \
            -vf "zoompan=z='min(zoom+0.0005,1.07)':d=240:s=1080x1920:fps=30,format=yuv420p" \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -pix_fmt yuv420p \
            work/scenes/scene4.mp4


      # ==========================================
      # ANIMATE SCENE 5
      # ==========================================
      - name: Animate scene 5
        run: |
          ffmpeg -y \
            -loop 1 \
            -i work/images/scene5.png \
            -t 8 \
            -vf "zoompan=z='min(zoom+0.0004,1.06)':d=240:s=1080x1920:fps=30,format=yuv420p" \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -pix_fmt yuv420p \
            work/scenes/scene5.mp4


      # ==========================================
      # JOIN SCENES
      # ==========================================
      - name: Join cinematic scenes
        run: |

          cat > work/scenes.txt <<'EOF'
          file 'scenes/scene1.mp4'
          file 'scenes/scene2.mp4'
          file 'scenes/scene3.mp4'
          file 'scenes/scene4.mp4'
          file 'scenes/scene5.mp4'
          EOF

          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i work/scenes.txt \
            -c copy \
            work/background.mp4

          echo "BACKGROUND CREATED"

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            work/background.mp4


      # ==========================================
      # SUBTITLES
      # ==========================================
      - name: Create subtitles
        run: |

          cat > work/subtitles.ass <<'EOF'
          [Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, It
