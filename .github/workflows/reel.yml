name: Deen in Sec - Create Reel V5

on:
  workflow_dispatch:

jobs:
  create-reel:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL TOOLS
      # ============================================================
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu fonts-liberation2
          ffmpeg -version
          python3 --version


      - name: Install Python packages
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow


      - name: Install Piper TTS
        run: |
          python3 -m pip install piper-tts


      # ============================================================
      # 3. CREATE WORK DIRECTORIES
      # ============================================================
      - name: Prepare folders
        run: |
          rm -rf work
          rm -rf output

          mkdir -p work
          mkdir -p work/scenes
          mkdir -p work/voice
          mkdir -p work/audio
          mkdir -p work/video
          mkdir -p work/subtitles
          mkdir -p output


      # ============================================================
      # 4. CREATE CINEMATIC SCENE GENERATOR
      # ============================================================
      - name: Create cinematic scene generator
        run: |
          cat > work/create_cinematic_scenes.py <<'PY'
          from PIL import Image, ImageDraw, ImageFilter, ImageEnhance
          import math
          import random
          import os

          W = 1440
          H = 2560

          OUT = "work/scenes"
          os.makedirs(OUT, exist_ok=True)

          random.seed(20260916)


          # --------------------------------------------------------
          # Helpers
          # --------------------------------------------------------

          def gradient(top, bottom):
              img = Image.new("RGB", (W, H))
              px = img.load()

              for y in range(H):
                  t = y / (H - 1)

                  r = int(top[0] * (1 - t) + bottom[0] * t)
                  g = int(top[1] * (1 - t) + bottom[1] * t)
                  b = int(top[2] * (1 - t) + bottom[2] * t)

                  for x in range(W):
                      px[x, y] = (r, g, b)

              return img


          def add_vignette(img, strength=0.72):
              overlay = Image.new("RGBA", (W, H), (0, 0, 0, 0))
              p = overlay.load()

              cx = W / 2
              cy = H / 2

              maxdist = math.sqrt(cx * cx + cy * cy)

              for y in range(H):
                  for x in range(W):
                      dx = x - cx
                      dy = y - cy

                      d = math.sqrt(dx * dx + dy * dy) / maxdist
                      alpha = int(max(0, min(210, (d ** 2.1) * 255 * strength)))

                      p[x, y] = (0, 0, 0, alpha)

              return Image.alpha_composite(img.convert("RGBA"), overlay)


          def add_glow(base, x, y, radius, color, alpha):
              glow = Image.new("RGBA", (W, H), (0, 0, 0, 0))
              gd = ImageDraw.Draw(glow)

              gd.ellipse(
                  (
                      x - radius,
                      y - radius,
                      x + radius,
                      y + radius
                  ),
                  fill=(*color, alpha)
              )

              glow = glow.filter(ImageFilter.GaussianBlur(radius // 2))

              return Image.alpha_composite(base, glow)


          def add_stars(base, count=170):
              layer = Image.new("RGBA", (W, H), (0, 0, 0, 0))
              d = ImageDraw.Draw(layer)

              for _ in range(count):
                  x = random.randint(30, W - 30)
                  y = random.randint(40, int(H * 0.55))

                  r = random.choice([1, 1, 1, 2, 2, 3])
                  a = random.randint(80, 190)

                  d.ellipse(
                      (x-r, y-r, x+r, y+r),
                      fill=(255, 245, 215, a)
                  )

              return Image.alpha_composite(base, layer)


          def add_particles(base, count=80):
              layer = Image.new("RGBA", (W, H), (0, 0, 0, 0))
              d = ImageDraw.Draw(layer)

              for _ in range(count):
                  x = random.randint(0, W)
                  y = random.randint(0, H)

                  r = random.choice([2, 3, 4, 6])
                  a = random.randint(20, 90)

                  d.ellipse(
                      (x-r, y-r, x+r, y+r),
                      fill=(245, 218, 160, a)
                  )

              layer = layer.filter(ImageFilter.GaussianBlur(1.5))

              return Image.alpha_composite(base, layer)


          def add_light_rays(base, origin_x, origin_y):
              layer = Image.new("RGBA", (W, H), (0, 0, 0, 0))
              d = ImageDraw.Draw(layer)

              for i in range(7):
                  spread = 120 + i * 90

                  points = [
                      (origin_x, origin_y),
                      (origin_x - spread, origin_y + 1100),
                      (origin_x + spread, origin_y + 1100)
                  ]

                  d.polygon(
                      points,
                      fill=(255, 205, 115, 9)
                  )

              layer = layer.filter(ImageFilter.GaussianBlur(22))

              return Image.alpha_composite(base, layer)


          def mosque_silhouette(base, horizon=1880):
              layer = Image.new("RGBA", (W, H), (0, 0, 0, 0))
              d = ImageDraw.Draw(layer)

              dark = (8, 9, 13, 255)

              # Main building
              d.rectangle(
                  (180, horizon - 250, W - 180, H),
                  fill=dark
              )

              # Main dome
              d.ellipse(
                  (430, horizon - 650, 1010, horizon - 70),
                  fill=dark
              )

              # Dome base
              d.rectangle(
                  (500, horizon - 390, 940, horizon),
                  fill=dark
              )

              # Dome finial
              d.rectangle(
                  (712, horizon - 720, 728, horizon - 630),
                  fill=dark
              )

              d.polygon(
                  [
                      (720, horizon - 770),
                      (700, horizon - 715),
                      (740, horizon - 715)
                  ],
                  fill=dark
              )

              # Minarets
              for x in [270, 1080]:
                  d.rectangle(
                      (x, horizon - 820, x + 70, horizon),
                      fill=dark
                  )

                  d.rectangle(
                      (x - 25, horizon - 850, x + 95, horizon - 810),
                      fill=dark
                  )

                  d.polygon(
                      [
                          (x + 35, horizon - 960),
                          (x - 5, horizon - 850),
                          (x + 75, horizon - 850)
                      ],
                      fill=dark
                  )

              # Door
              d.ellipse(
                  (670, horizon - 260, 770, horizon + 30),
                  fill=(2, 3, 5, 255)
              )

              # Windows
              for row in range(2):
                  yy = horizon - 190 + row * 95

                  for xx in [310, 420, 1020, 1130]:
                      d.rounded_rectangle(
                          (xx, yy, xx + 55, yy + 95),
                          radius=25,
                          fill=(35, 29, 18, 255)
                      )

              return Image.alpha_composite(base, layer)


          def add_cinematic_grain(base):
              layer = Image.new("RGBA", (W, H), (0, 0, 0, 0))
              d = ImageDraw.Draw(layer)

              for _ in range(9000):
                  x = random.randrange(W)
                  y = random.randrange(H)

                  if random.random() < 0.5:
                      a = random.randint(5, 18)
                      c = random.randint(120, 230)
                      d.point((x, y), fill=(c, c, c, a))

              return Image.alpha_composite(base, layer)


          def save(img, filename):
              img = img.convert("RGB")
              img = ImageEnhance.Contrast(img).enhance(1.08)
              img = ImageEnhance.Color(img).enhance(0.92)

              img.save(
                  os.path.join(OUT, filename),
                  quality=96
              )


          # ========================================================
          # SCENE 1 — NIGHT MOSQUE
          # ========================================================

          scene = gradient(
              (5, 9, 18),
              (24, 19, 17)
          )

          scene = add_stars(scene, 220)

          scene = add_glow(
              scene,
              1080,
              520,
              300,
              (225, 181, 90),
              40
          )

          scene = add_glow(
              scene,
              720,
              1810,
              450,
              (219, 164, 70),
              25
          )

          scene = add_light_rays(
              scene,
              720,
              1700
          )

          scene = mosque_silhouette(
              scene,
              1880
          )

          scene = add_particles(scene, 90)
          scene = add_cinematic_grain(scene)
          scene = add_vignette(scene, 0.78)

          save(scene, "scene1.png")


          # ========================================================
          # SCENE 2 — HADITH BOOK
          # ========================================================

          scene = gradient(
              (18, 13, 10),
              (52, 34, 19)
          )

          # Wooden surface
          wood = Image.new("RGBA", (W, H), (0, 0, 0, 0))
          wd = ImageDraw.Draw(wood)

          for y in range(1450, H):
              shade = int(45 + ((y - 1450) / (H - 1450)) * 25)

              wd.line(
                  (0, y, W, y),
                  fill=(shade, int(shade * 0.68), int(shade * 0.40), 255),
                  width=2
              )

          scene = Image.alpha_composite(scene.convert("RGBA"), wood)

          # Lamp glow
          scene = add_glow(
              scene,
              1090,
              670,
              500,
              (255, 188, 82),
              65
          )

          # Book shadow
          shadow = Image.new("RGBA", (W, H), (0, 0, 0, 0))
          sd = ImageDraw.Draw(shadow)

          sd.rounded_rectangle(
              (280, 1050, 1160, 2040),
              radius=55,
              fill=(0, 0, 0, 150)
          )

          shadow = shadow.filter(ImageFilter.GaussianBlur(35))
          scene = Image.alpha_composite(scene, shadow)

          # Book
          book = Image.new("RGBA", (W, H), (0, 0, 0, 0))
          bd = ImageDraw.Draw(book)

          bd.rounded_rectangle(
              (300, 980, 1140, 1990),
              radius=42,
              fill=(64, 38, 19, 255),
              outline=(190, 142, 66, 255),
              width=8
          )

          # Pages
          bd.polygon(
              [
                  (720, 1040),
                  (1080, 1100),
                  (1080, 1910),
                  (720, 1970)
              ],
              fill=(226, 213, 177, 255)
          )

          bd.polygon(
              [
                  (720, 1040),
                  (360, 1100),
                  (360, 1910),
                  (720, 1970)
              ],
              fill=(239, 227, 194, 255)
          )

          # Page lines
          for i in range(13):
              yy = 1160 + i * 55

              bd.line(
                  (420, yy, 680, yy + 8),
                  fill=(126, 108, 77, 110),
                  width=3
              )

              bd.line(
                  (760, yy + 8, 1020, yy),
                  fill=(126, 108, 77, 110),
                  width=3
              )

          # Decorative center
          bd.ellipse(
              (680, 1430, 760, 1510),
              outline=(157, 117, 51, 220),
              width=4
          )

          scene = Image.alpha_composite(scene, book)

          scene = add_particles(scene, 120)
          scene = add_cinematic_grain(scene)
          scene = add_vignette(scene, 0.66)

          save(scene, "scene2.png")


          # ========================================================
          # SCENE 3 — MOONLIT LANDSCAPE
          # ========================================================

          scene = gradient(
              (3, 7, 18),
              (11, 21, 30)
          )

          scene = add_stars(scene, 330)

          # Moon
          moon = Image.new("RGBA", (W, H), (0, 0, 0, 0))
          md = ImageDraw.Draw(moon)

          md.ellipse(
              (1000, 330, 1260, 590),
              fill=(245, 236, 203, 245)
          )

          # Moon shadow to make crescent
          md.ellipse(
              (1080, 285, 1320, 545),
              fill=(4, 8, 19, 255)
          )

          moon = moon.filter(ImageFilter.GaussianBlur(0.5))
          scene = Image.alpha_composite(scene, moon)

          # Horizon glow
          scene = add_glow(
              scene,
              720,
              1770,
              600,
              (65, 113, 125),
              45
          )

          # Mountains
          mountains = Image.new("RGBA", (W, H), (0, 0, 0, 0))
          m = ImageDraw.Draw(mountains)

          m.polygon(
              [
                  (0, 1980),
                  (180, 1780),
                  (360, 1920),
                  (610, 1580),
                  (820, 1870),
                  (1080, 1650),
                  (1440, 1930),
                  (1440, H),
                  (0, H)
              ],
              fill=(7, 16, 21, 255)
          )

          m.polygon(
              [
                  (0, 2100),
                  (300, 1940),
                  (500, 2050),
                  (780, 1800),
                  (1010, 2020),
                  (1250, 1850),
                  (1440, 2070),
                  (1440, H),
                  (0, H)
              ],
              fill=(4, 10, 14, 255)
          )

          scene = Image.alpha_composite(scene, mountains)

          # Reflection / foreground
          foreground = Image.new("RGBA", (W, H), (0, 0, 0, 0))
          fd = ImageDraw.Draw(foreground)

          for i in range(18):
              yy = 2150 + i * 25

              fd.line(
                  (250, yy, 1190, yy),
                  fill=(65, 91, 90, max(5, 35 - i)),
                  width=3
              )

          scene = Image.alpha_composite(scene, foreground)

          scene = add_particles(scene, 120)
          scene = add_cinematic_grain(scene)
          scene = add_vignette(scene, 0.72)

          save(scene, "scene3.png")


          # ========================================================
          # SCENE 4 — MOSQUE INTERIOR
          # ========================================================

          scene = gradient(
              (10, 8, 8),
              (41, 27, 17)
          )

          scene = add_glow(
              scene,
              720,
              780,
              550,
              (245, 184, 86),
              52
          )

          scene = add_light_rays(
              scene,
              720,
              800
          )

          interior = Image.new("RGBA", (W, H), (0, 0, 0, 0))
          d = ImageDraw.Draw(interior)

          # Floor
          d.polygon(
              [
                  (0, 1600),
                  (W, 1600),
                  (W, H),
                  (0, H)
              ],
              fill=(31, 21, 17, 255)
          )

          # Perspective floor lines
          for i in range(10):
              yy = 1650 + i * 95

              d.line(
                  (720, 1530, 80, yy),
                  fill=(117, 76, 39, 70),
                  width=3
              )

              d.line(
                  (720, 1530, W - 80, yy),
                  fill=(117, 76, 39, 70),
                  width=3
              )

          # Side pillars
          for x in [80, 1160]:
              d.rectangle(
                  (x, 400, x + 190, 1740),
                  fill=(19, 15, 13, 255)
              )

              d.ellipse(
                  (x - 40, 310, x + 230, 610),
                  fill=(19, 15, 13, 255)
              )

          # Central arch
          d.rounded_rectangle(
              (360, 540, 1080, 1850),
              radius=360,
              fill=(14, 11, 10, 255)
          )

          d.rounded_rectangle(
              (435, 650, 1005, 1850),
              radius=280,
              fill=(27, 19, 15, 255),
              outline=(145, 100, 47, 180),
              width=5
          )

          # Mihrab
          d.polygon(
              [
                  (720, 820),
                  (570, 1010),
                  (570, 1760),
                  (870, 1760),
                  (870, 1010)
              ],
              fill=(9, 8, 8, 255)
          )

          # Warm central light
          d.ellipse(
              (660, 900, 780, 1020),
              fill=(230, 177, 82, 170)
          )

          scene = Image.alpha_composite(scene, interior)

          scene = add_particles(scene, 170)
          scene = add_cinematic_grain(scene)
          scene = add_vignette(scene, 0.78)

          save(scene, "scene4.png")


                  # ========================================================
          # SCENE 5 — DAWN / BRAND ENDING
          # ========================================================

          scene = gradient(
              (19, 17, 27),
              (174, 101, 48)
          )

          # Sunrise glow
          scene = add_glow(
              scene,
              720,
              1590,
              620,
              (255, 195, 100),
              95
          )

          # Horizon
          horizon = Image.new("RGBA", (W, H), (0, 0, 0, 0))
          hd = ImageDraw.Draw(horizon)

          hd.rectangle(
              (0, 1860, W, H),
              fill=(20, 14, 13, 255)
          )

          # Dawn mosque
          hd.rectangle(
              (270, 1650, 1170, 1900),
              fill=(14, 11, 12, 255)
          )

          hd.ellipse(
              (500, 1390, 940, 1770),
              fill=(14, 11, 12, 255)
          )

          # Minarets
          for x in [350, 1010]:
              hd.rectangle(
                  (x, 1210, x + 65, 1880),
                  fill=(14, 11, 12, 255)
              )

              hd.rectangle(
                  (x - 25, 1180, x + 90, 1220),
                  fill=(14, 11, 12, 255)
              )

              hd.polygon(
                  [
                      (x + 32, 1060),
                      (x - 5, 1180),
                      (x + 70, 1180)
                  ],
                  fill=(14, 11, 12, 255)
              )

          scene = Image.alpha_composite(scene, horizon)

          # Atmospheric haze
          haze = Image.new("RGBA", (W, H), (0, 0, 0, 0))
          hz = ImageDraw.Draw(haze)

          for i in range(12):
              yy = 1550 + i * 60

              hz.ellipse(
                  (-200, yy, W + 200, yy + 180),
                  fill=(255, 210, 150, 5)
              )

          haze = haze.filter(ImageFilter.GaussianBlur(45))
          scene = Image.alpha_composite(scene, haze)

          scene = add_particles(scene, 150)
          scene = add_cinematic_grain(scene)
          scene = add_vignette(scene, 0.66)

          save(scene, "scene5.png")


          print("Cinematic scenes created successfully.")

          for i in range(1, 6):
              path = f"{OUT}/scene{i}.png"

              if not os.path.exists(path):
                  raise RuntimeError(f"Missing {path}")

              print(path, os.path.getsize(path))

          PY


      - name: Generate cinematic scenes
        run: |
          python3 work/create_cinematic_scenes.py


      # ============================================================
      # 5. DOWNLOAD MALE PIPER VOICE
      # ============================================================
      - name: Download Piper voice
        run: |
          python3 -m piper.download_voices en_US-hfc_male-medium


      # ============================================================
      # 6. CREATE VOICE SCRIPTS
      # ============================================================
      - name: Create voice scripts
        run: |
          cat > work/voice/part1.txt <<'EOF'
          Your actions might look good... but what really matters is WHY you did them.
          EOF

          cat > work/voice/part2.txt <<'EOF'
          The Prophet Muhammad, peace and blessings be upon him, said:
          EOF

          cat > work/voice/part3.txt <<'EOF'
          The reward of deeds depends upon the intentions, and every person will get the reward according to what they have intended.
          EOF

          cat > work/voice/part4.txt <<'EOF'
          So before you do something, ask yourself... Why am I doing this?
          EOF

          cat > work/voice/part5.txt <<'EOF'
          A small action with a sincere intention can have a huge reward.
          EOF

          cat > work/voice/part6.txt <<'EOF'
          What will you make your intention for today?
          EOF

          cat > work/voice/part7.txt <<'EOF'
          Sahih al-Bukhari 1. Narrated by Umar ibn al-Khattab.
          EOF


      # ============================================================
      # 7. GENERATE INDIVIDUAL VOICE SEGMENTS
      # ============================================================
      - name: Generate voice segments
        run: |
          VOICE_MODEL="$HOME/.local/share/piper/en_US-hfc_male-medium.onnx"

          if [ ! -f "$VOICE_MODEL" ]; then
            echo "Searching for Piper model..."
            find "$HOME" -name "en_US-hfc_male-medium.onnx" -print
          fi

          python3 -m piper \
            --model "$VOICE_MODEL" \
            --input_file work/voice/part1.txt \
            --output_file work/voice/part1.wav

          python3 -m piper \
            --model "$VOICE_MODEL" \
            --input_file work/voice/part2.txt \
            --output_file work/voice/part2.wav

          python3 -m piper \
            --model "$VOICE_MODEL" \
            --input_file work/voice/part3.txt \
            --output_file work/voice/part3.wav

          python3 -m piper \
            --model "$VOICE_MODEL" \
            --input_file work/voice/part4.txt \
            --output_file work/voice/part4.wav

          python3 -m piper \
            --model "$VOICE_MODEL" \
            --input_file work/voice/part5.txt \
            --output_file work/voice/part5.wav

          python3 -m piper \
            --model "$VOICE_MODEL" \
            --input_file work/voice/part6.txt \
            --output_file work/voice/part6.wav

          python3 -m piper \
            --model "$VOICE_MODEL" \
            --input_file work/voice/part7.txt \
            --output_file work/voice/part7.wav


      # ============================================================
      # 8. ADD NATURAL PAUSES
      # ============================================================
      - name: Create cinematic pauses
        run: |
          ffmpeg -y \
            -f lavfi \
            -i "anullsrc=r=22050:cl=mono:d=0.35" \
            -t 0.35 \
            work/voice/pause_short.wav

          ffmpeg -y \
            -f lavfi \
            -i "anullsrc=r=22050:cl=mono:d=0.65" \
            -t 0.65 \
            work/voice/pause_long.wav


      # ============================================================
      # 9. CONCATENATE VOICE
      # ============================================================
      - name: Build natural voice track
        run: |
          cat > work/voice/concat.txt <<'EOF'
          file 'part1.wav'
          file 'pause_short.wav'
          file 'part2.wav'
          file 'pause_short.wav'
          file 'part3.wav'
          file 'pause_long.wav'
          file 'part4.wav'
          file 'pause_short.wav'
          file 'part5.wav'
          file 'pause_short.wav'
          file 'part6.wav'
          file 'pause_long.wav'
          file 'part7.wav'
          EOF

          cd work/voice

          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i concat.txt \
            -c copy \
            ../audio/voice_raw.wav

          cd ../..

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            work/audio/voice_raw.wav


      # ============================================================
      # 10. PREPARE FINAL AUDIO
      # ============================================================
      - name: Normalize voice timing
        run: |
          python3 - <<'PY'
          import subprocess

          raw = "work/audio/voice_raw.wav"

          result = subprocess.check_output([
              "ffprobe",
              "-v", "error",
              "-show_entries", "format=duration",
              "-of", "default=noprint_wrappers=1:nokey=1",
              raw
          ])

          duration = float(result.decode().strip())

          print(f"Raw voice duration: {duration:.3f} seconds")

          target = 39.2

          if duration > target:
              ratio = duration / target

              filters = []

              while ratio > 2.0:
                  filters.append("atempo=2.0")
                  ratio /= 2.0

              filters.append(f"atempo={ratio:.6f}")

              filter_string = ",".join(filters)

              command = [
                  "ffmpeg",
                  "-y",
                  "-i",
                  raw,
                  "-af",
                  filter_string,
                  "-ar",
                  "22050",
                  "-ac",
                  "1",
                  "work/audio/voice_final.wav"
              ]

          else:
              pad = target - duration

              command = [
                  "ffmpeg",
                  "-y",
                  "-i",
                  raw,
                  "-af",
                  f"apad=pad_dur={pad:.3f}",
                  "-t",
                  f"{target:.3f}",
                  "-ar",
                  "22050",
                  "-ac",
                  "1",
                  "work/audio/voice_final.wav"
              ]

          print("Running:", " ".join(command))

          subprocess.run(command, check=True)

          PY


      # ============================================================
      # 11. VERIFY AUDIO
      # ============================================================
      - name: Check final voice
        run: |
          ffprobe \
            -v error \
            -show_entries \
            format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            work/audio/voice_final.wav


      # ============================================================
      # 12. CREATE SCENE VIDEOS
      # ============================================================
      - name: Animate cinematic scenes
        run: |
          ffmpeg -y \
