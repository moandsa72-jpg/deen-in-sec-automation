name: Deen in Sec - Create Reel

on:
  workflow_dispatch:

jobs:
  create-reel:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # INSTALL TOOLS
      # ==========================================
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow

      # ==========================================
      # INSTALL PIPER
      # ==========================================
      - name: Install Piper TTS
        run: |
          python3 -m pip install piper-tts

      # ==========================================
      # CREATE FOLDERS
      # ==========================================
      - name: Create folders
        run: |
          rm -rf work
          mkdir -p work
          mkdir -p work/images
          mkdir -p work/scenes
          mkdir -p output

      # ==========================================
      # CREATE CINEMATIC VISUAL ARTWORK
      # ==========================================
      - name: Create cinematic visual artwork
        run: |

          cat > work/create_visuals.py <<'PY'

          from PIL import Image, ImageDraw, ImageFilter
          import random
          import math

          W = 1080
          H = 1920

          GOLD = (205, 170, 95)

          random.seed(42)

          def gradient(top, bottom):

              img = Image.new("RGB", (W, H))
              draw = ImageDraw.Draw(img)

              for y in range(H):

                  t = y / (H - 1)

                  r = int(top[0] * (1 - t) + bottom[0] * t)
                  g = int(top[1] * (1 - t) + bottom[1] * t)
                  b = int(top[2] * (1 - t) + bottom[2] * t)

                  draw.line(
                      (0, y, W, y),
                      fill=(r, g, b)
                  )

              return img

          def vignette(img):

              overlay = Image.new(
                  "RGBA",
                  (W, H),
                  (0, 0, 0, 0)
              )

              draw = ImageDraw.Draw(overlay)

              cx = W / 2
              cy = H / 2

              for y in range(0, H, 12):

                  for x in range(0, W, 12):

                      dx = (x - cx) / (W / 2)
                      dy = (y - cy) / (H / 2)

                      distance = math.sqrt(dx * dx + dy * dy)

                      if distance > 0.45:

                          alpha = int(
                              min(
                                  170,
                                  (distance - 0.45) * 220
                              )
                          )

                          draw.rectangle(
                              (x, y, x + 12, y + 12),
                              fill=(0, 0, 0, alpha)
                          )

              return Image.alpha_composite(
                  img.convert("RGBA"),
                  overlay
              ).convert("RGB")

          def glow(img, x, y, radius, color, alpha):

              layer = Image.new(
                  "RGBA",
                  (W, H),
                  (0, 0, 0, 0)
              )

              draw = ImageDraw.Draw(layer)

              draw.ellipse(
                  (
                      x - radius,
                      y - radius,
                      x + radius,
                      y + radius
                  ),
                  fill=(*color, alpha)
              )

              layer = layer.filter(
                  ImageFilter.GaussianBlur(radius // 3)
              )

              return Image.alpha_composite(
                  img.convert("RGBA"),
                  layer
              ).convert("RGB")

          def stars(img, amount):

              draw = ImageDraw.Draw(img)

              for _ in range(amount):

                  x = random.randint(20, W - 20)
                  y = random.randint(20, 1250)

                  radius = random.choice([1, 1, 1, 2])

                  draw.ellipse(
                      (
                          x - radius,
                          y - radius,
                          x + radius,
                          y + radius
                      ),
                      fill=(225, 215, 180)
                  )

          def draw_mosque(img):

              draw = ImageDraw.Draw(img)

              base = 1530

              draw.rectangle(
                  (150, 1050, 930, base),
                  fill=(3, 7, 10)
              )

              draw.ellipse(
                  (350, 680, 730, 1120),
                  fill=(3, 7, 10)
              )

              draw.rectangle(
                  (350, 880, 730, 1120),
                  fill=(3, 7, 10)
              )

              draw.polygon(
                  [
                      (540, 600),
                      (495, 700),
                      (585, 700)
                  ],
                  fill=(3, 7, 10)
              )

              for cx in [230, 850]:

                  draw.rectangle(
                      (cx - 34, 650, cx + 34, 1530),
                      fill=(2, 6, 9)
                  )

                  draw.ellipse(
                      (cx - 54, 590, cx + 54, 700),
                      fill=(2, 6, 9)
                  )

                  draw.polygon(
                      [
                          (cx, 485),
                          (cx - 40, 610),
                          (cx + 40, 610)
                      ],
                      fill=(2, 6, 9)
                  )

              for x in [250, 380, 510, 640, 770]:

                  draw.rectangle(
                      (x, 1180, x + 70, 1530),
                      fill=(1, 5, 8)
                  )

                  draw.ellipse(
                      (x, 1110, x + 70, 1240),
                      fill=(1, 5, 8)
                  )

              for x in [275, 405, 535, 665, 795]:

                  draw.rectangle(
                      (x, 1260, x + 25, 1400),
                      fill=(100, 78, 40)
                  )

          # ==========================================
          # SCENE 1
          # ==========================================

          img = gradient(
              (2, 7, 15),
              (12, 25, 31)
          )

          img = glow(
              img,
              540,
              700,
              520,
              GOLD,
              38
          )

          stars(img, 220)
          draw_mosque(img)

          img = vignette(img)

          img.save("work/images/scene1.png")

          # ==========================================
          # SCENE 2
          # ==========================================

          img = gradient(
              (4, 10, 17),
              (27, 20, 13)
          )

          img = glow(
              img,
              540,
              750,
              500,
              GOLD,
              42
          )

          draw = ImageDraw.Draw(img)

          draw.rectangle(
              (0, 1370, W, H),
              fill=(6, 5, 4)
          )

          draw.rounded_rectangle(
              (140, 870, 940, 1470),
              radius=45,
              fill=(1, 2, 3)
          )

          draw.polygon(
              [
                  (200, 850),
                  (535, 950),
                  (535, 1390),
                  (200, 1280)
              ],
              fill=(203, 188, 151)
          )

          draw.polygon(
              [
                  (545, 950),
                  (880, 850),
                  (880, 1280),
                  (545, 1390)
              ],
              fill=(225, 210, 174)
          )

          draw.line(
              (540, 945, 540, 1390),
              fill=(105, 82, 45),
              width=7
          )

          for i in range(7):

              y = 1010 + i * 45

              draw.line(
                  (275, y, 495, y + 55),
                  fill=(115, 96, 65),
                  width=3
              )

              draw.line(
                  (585, y + 55, 805, y),
                  fill=(115, 96, 65),
                  width=3
              )

          draw.polygon(
              [
                  (528, 940),
                  (565, 940),
                  (565, 1420),
                  (547, 1395),
                  (528, 1420)
              ],
              fill=GOLD
          )

          img = vignette(img)

          img.save("work/images/scene2.png")

          # ==========================================
          # SCENE 3
          # ==========================================

          img = gradient(
              (2, 7, 17),
              (12, 28, 36)
          )

          stars(img, 300)

          img = glow(
              img,
              790,
              410,
              300,
              (220, 200, 145),
              40
          )

          draw = ImageDraw.Draw(img)

          draw.ellipse(
              (700, 330, 870, 500),
              fill=(220, 210, 180)
          )

          draw.ellipse(
              (665, 305, 835, 475),
              fill=(3, 9, 18)
          )

          draw.polygon(
              [
                  (0, 1480),
                  (240, 1160),
                  (470, 1480),
                  (690, 1110),
                  (1080, 1490),
                  (1080, H),
                  (0, H)
              ],
              fill=(3, 10, 15)
          )

          for i in range(25):

              y = 1530 + i * 16

              x = random.randint(80, 700)
              width = random.randint(130, 500)

              draw.line(
                  (x, y, x + width, y),
                  fill=(75, 67, 45),
                  width=random.randint(1, 3)
              )

          img = vignette(img)

          img.save("work/images/scene3.png")          # ==========================================
          # SCENE 4
          # ==========================================

          img = gradient(
              (3, 8, 14),
              (23, 18, 12)
          )

          img = glow(
              img,
              540,
              480,
              650,
              GOLD,
              40
          )

          draw = ImageDraw.Draw(img)

          draw.polygon(
              [
                  (130, 1500),
                  (130, 850),
                  (270, 620),
                  (540, 490),
                  (810, 620),
                  (950, 850),
                  (950, 1500)
              ],
              fill=(8, 13, 16)
          )

          draw.polygon(
              [
                  (260, 1500),
                  (260, 900),
                  (360, 730),
                  (540, 630),
                  (720, 730),
                  (820, 900),
                  (820, 1500)
              ],
              fill=(3, 7, 10)
          )

          for x in [380, 465, 550, 635]:

              draw.rectangle(
                  (x, 760, x + 35, 1050),
                  fill=(100, 80, 48)
              )

          draw.polygon(
              [
                  (130, 1500),
                  (950, 1500),
                  (1080, H),
                  (0, H)
              ],
              fill=(6, 8, 9)
          )

          for i in range(9):

              y = 1540 + i * 45

              draw.line(
                  (230, y, 850, y),
                  fill=(48, 41, 29),
                  width=3
              )

          rays = Image.new(
              "RGBA",
              (W, H),
              (0, 0, 0, 0)
          )

          rd = ImageDraw.Draw(rays)

          rd.polygon(
              [
                  (475, 540),
                  (605, 540),
                  (950, 1450),
                  (130, 1450)
              ],
              fill=(235, 205, 140, 28)
          )

          rays = rays.filter(
              ImageFilter.GaussianBlur(35)
          )

          img = Image.alpha_composite(
              img.convert("RGBA"),
              rays
          ).convert("RGB")

          img = vignette(img)

          img.save("work/images/scene4.png")

          # ==========================================
          # SCENE 5
          # ==========================================

          img = gradient(
              (4, 12, 23),
              (58, 40, 22)
          )

          img = glow(
              img,
              540,
              1050,
              560,
              GOLD,
              45
          )

          draw = ImageDraw.Draw(img)

          for y in range(1050, 1500):

              t = (y - 1050) / 450

              r = int(35 + 75 * t)
              g = int(27 + 58 * t)
              b = int(19 + 35 * t)

              draw.line(
                  (0, y, W, y),
                  fill=(r, g, b)
              )

          draw.ellipse(
              (430, 960, 650, 1180),
              fill=(225, 190, 110)
          )

          draw.polygon(
              [
                  (0, 1480),
                  (250, 1340),
                  (500, 1450),
                  (720, 1320),
                  (1080, 1450),
                  (1080, H),
                  (0, H)
              ],
              fill=(3, 7, 9)
          )

          img = vignette(img)

          img.save("work/images/scene5.png")

          print("CINEMATIC ARTWORK CREATED")

          PY

          python3 work/create_visuals.py

      # ==========================================
      # DOWNLOAD MALE VOICE
      # ==========================================
      - name: Download male voice
        run: |
          python3 -m piper.download_voices en_US-hfc_male-medium

      # ==========================================
      # CREATE VOICE SEGMENTS
      # ==========================================
      - name: Create voice segments
        run: |

          cat > work/part1.txt <<'EOF'
          Your actions might look good...
          but what really matters is WHY you did them.
          EOF

          cat > work/part2.txt <<'EOF'
          The Prophet Muhammad, peace and blessings be upon him, said:
          EOF

          cat > work/part3.txt <<'EOF'
          The reward of deeds depends upon the intentions,
          and every person will get the reward according to what they have intended.
          EOF

          cat > work/part4.txt <<'EOF'
          So before you do something, ask yourself...
          Why am I doing this?
          EOF

          cat > work/part5.txt <<'EOF'
          A small action with a sincere intention can have a huge reward.
          EOF

          cat > work/part6.txt <<'EOF'
          What will you make your intention for today?
          EOF

          cat > work/part7.txt <<'EOF'
          Sahih al-Bukhari 1.
          Narrated by Umar ibn al-Khattab.
          EOF

          for i in 1 2 3 4 5 6 7
          do

            echo "Generating voice segment $i..."

            cat work/part$i.txt | \
            piper \
              --model en_US-hfc_male-medium \
              --output_file work/raw$i.wav

            ffmpeg -y \
              -i work/raw$i.wav \
              -filter:a "atempo=0.92" \
              -ar 22050 \
              -ac 1 \
              work/part$i.wav

          done

          echo "VOICE SEGMENTS CREATED"

      # ==========================================
      # BUILD FINAL VOICE
      # ==========================================
      - name: Build final voice
        run: |

          echo "Creating silence files..."

          ffmpeg -y \
            -f lavfi \
            -i "anullsrc=r=22050:cl=mono" \
            -t 0.8 \
            -c:a pcm_s16le \
            work/silence1.wav

          ffmpeg -y \
            -f lavfi \
            -i "anullsrc=r=22050:cl=mono" \
            -t 0.7 \
            -c:a pcm_s16le \
            work/silence2.wav

          ffmpeg -y \
            -f lavfi \
            -i "anullsrc=r=22050:cl=mono" \
            -t 0.9 \
            -c:a pcm_s16le \
            work/silence3.wav

          ffmpeg -y \
            -f lavfi \
            -i "anullsrc=r=22050:cl=mono" \
            -t 0.8 \
            -c:a pcm_s16le \
            work/silence4.wav

          ffmpeg -y \
            -f lavfi \
            -i "anullsrc=r=22050:cl=mono" \
            -t 0.8 \
            -c:a pcm_s16le \
            work/silence5.wav

          ffmpeg -y \
            -f lavfi \
            -i "anullsrc=r=22050:cl=mono" \
            -t 0.7 \
            -c:a pcm_s16le \
            work/silence6.wav

          cat > work/audio_list.txt <<'EOF'
          file 'part1.wav'
          file 'silence1.wav'
          file 'part2.wav'
          file 'silence2.wav'
          file 'part3.wav'
          file 'silence3.wav'
          file 'part4.wav'
          file 'silence4.wav'
          file 'part5.wav'
          file 'silence5.wav'
          file 'part6.wav'
          file 'silence6.wav'
          file 'part7.wav'
          EOF

          echo "Joining voice..."

          cd work

          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i audio_list.txt \
            -c copy \
            voice_joined.wav

          cd ..

          echo "Normalizing final voice..."

          ffmpeg -y \
            -i work/voice_joined.wav \
            -af "loudnorm=I=-16:TP=-1.5:LRA=11,apad,atrim=duration=40" \
            -ar 22050 \
            -ac 1 \
            -c:a pcm_s16le \
            work/voice.wav

          echo "FINAL VOICE CREATED"

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            work/voice.wav

      # ==========================================
      # ANIMATE SCENE 1
      # ==========================================
      - name: Animate scene 1
        run: |

          ffmpeg -y \
            -loop 1 \
            -framerate 30 \
            -i work/images/scene1.png \
            -t 8 \
            -vf "zoompan=z='min(zoom+0.0007,1.08)':d=240:s=1080x1920:fps=30,format=yuv420p" \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -pix_fmt yuv420p \
            work/scenes/scene1.mp4

      # ==========================================
      # ANIMATE SCENE 2
      # ==========================================
      - name: Animate scene 2
        run: |

          ffmpeg -y \
            -loop 1 \
            -framerate 30 \
            -i work/images/scene2.png \
            -t 8 \
            -vf "zoompan=z='min(zoom+0.0005,1.07)':d=240:s=1080x1920:fps=30,format=yuv420p" \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -pix_fmt yuv420p \
            work/scenes/scene2.mp4

      # ==========================================
      # ANIMATE SCENE 3
      # ==========================================
      - name: Animate scene 3
        run: |

          ffmpeg -y \
            -loop 1 \
            -framerate 30 \
            -i work/images/scene3.png \
            -t 8 \
            -vf "zoompan=z='min(zoom+0.0006,1.075)':d=240:s=1080x1920:fps=30,format=yuv420p" \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -pix_fmt yuv420p \
            work/scenes/scene3.mp4

      # ==========================================
      # ANIMATE SCENE 4
      # ==========================================
      - name: Animate scene 4
        run: |

          ffmpeg -y \
            -loop 1 \
            -framerate 30 \
            -i work/images/scene4.png \
            -t 8 \
            -vf "zoompan=z='min(zoom+0.0005,1.07)':d=240:s=1080x1920:fps=30,format=yuv420p" \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -pix_fmt yuv420p \
            work/scenes/scene4.mp4

      # ==========================================
      # ANIMATE SCENE 5
      # ==========================================
      - name: Animate scene 5
        run: |

          ffmpeg -y \
            -loop 1 \
            -framerate 30 \
            -i work/images/scene5.png \
            -t 8 \
            -vf "zoompan=z='min(zoom+0.0004,1.06)':d=240:s=1080x1920:fps=30,format=yuv420p" \
            -c:v libx264 \
            -preset veryfast \
            -crf 20 \
            -pix_fmt yuv420p \
            work/scenes/scene5.mp4

      # ==========================================
      # JOIN CINEMATIC SCENES
      # ==========================================
      - name: Join cinematic scenes
        run: |

          cat > work/scenes.txt <<'EOF'
          file 'scenes/scene1.mp4'
          file 'scenes/scene2.mp4'
          file 'scenes/scene3.mp4'
          file 'scenes/scene4.mp4'
          file 'scenes/scene5.mp4'
          EOF

          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i work/scenes.txt \
            -c copy \
            work/background.mp4

          echo "BACKGROUND CREATED"

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            work/background.mp4

      # ==========================================
      # CREATE SUBTITLES
      # ==========================================
      - name: Create subtitles
        run: |

          cat > work/subtitles.ass <<'EOF'

          [Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Main,DejaVu Sans,60,&H00FFFFFF,&H00FFFFFF,&H00120E08,&HAA000000,1,0,5,130,130,430,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text

          Dialogue: 0,0:00:00.00,0:00:04.00,Main,,0,0,0,,YOUR ACTIONS MIGHT LOOK GOOD...

          Dialogue: 0,0:00:04.00,0:00:08.00,Main,,0,0,0,,BUT WHAT REALLY MATTERS IS WHY YOU DID THEM.

          Dialogue: 0,0:00:08.00,0:00:12.50,Main,,0,0,0,,The Prophet Muhammad, peace and blessings be upon him, said:

          Dialogue: 0,0:00:12.50,0:00:18.50,Main,,0,0,0,,The reward of deeds depends upon the intentions,

          Dialogue: 0,0:00:18.50,0:00:24.80,Main,,0,0,0,,and every person will get the reward according to what they have intended.

          Dialogue: 0,0:00:24.80,0:00:28.50,Main,,0,0,0,,So before you do something, ask yourself:

          Dialogue: 0,0:00:28.50,0:00:32.00,Main,,0,0,0,,WHY AM I DOING THIS?

          Dialogue: 0,0:00:32.00,0:00:36.00,Main,,0,0,0,,A small action with a sincere intention can have a huge reward.

          Dialogue: 0,0:00:36.00,0:00:39.00,Main,,0,0,0,,WHAT WILL YOU MAKE YOUR INTENTION FOR TODAY?

          Dialogue: 0,0:00:39.00,0:00:40.00,Main,,0,0,0,,SAHIH AL-BUKHARI 1 • UMAR IBN AL-KHATTAB

          EOF

      # ==========================================
      # RENDER FINAL REEL
      # ==========================================
      - name: Render final Reel
        run: |

          echo "Rendering final Reel..."

          ffmpeg -y \
            -i work/background.mp4 \
            -i work/voice.wav \
            -vf "fade=t=in:st=0:d=1,fade=t=out:st=38:d=2,subtitles=work/subtitles.ass" \
            -map 0:v:0 \
            -map 1:a:0 \
            -t 40 \
            -c:v libx264 \
            -preset medium \
            -crf 19 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 192k \
            -ar 44100 \
            -movflags +faststart \
            output/deen-in-sec-hadith-001.mp4

          echo "FINAL REEL RENDERED"

          ls -lh output/deen-in-sec-hadith-001.mp4

      # ==========================================
      # CHECK FINAL REEL
      # ==========================================
      - name: Check final Reel
        run: |

          echo "======================================"
          echo "DEEN IN SEC V4 REEL CREATED"
          echo "======================================"

          ls -lh output/deen-in-sec-hadith-001.mp4

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=width,height,codec_name \
            -of default=noprint_wrappers=1 \
            output/deen-in-sec-hadith-001.mp4

      # ==========================================
      # UPLOAD REEL
      # ==========================================
      - name: Upload Reel
        uses: actions/upload-artifact@v4
        with:
          name: deen-in-sec-hadith-001-v4
          path: output/deen-in-sec-hadith-001.mp4
          if-no-files-found: error
          retention-days: 7
