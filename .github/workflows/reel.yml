name: Deen in Sec - Create Reel V5

on:
  workflow_dispatch:

jobs:
  create-reel:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL TOOLS
      # ============================================================
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu fonts-liberation2

          echo "FFmpeg:"
          ffmpeg -version | head -n 1

          echo "Python:"
          python3 --version


      - name: Install Python packages
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow


      - name: Install Piper TTS
        run: |
          python3 -m pip install piper-tts


      # ============================================================
      # 3. PREPARE FOLDERS
      # ============================================================
      - name: Prepare folders
        run: |
          rm -rf work
          rm -rf output

          mkdir -p work/scenes
          mkdir -p work/voice
          mkdir -p work/audio
          mkdir -p work/video
          mkdir -p work/subtitles
          mkdir -p output


      # ============================================================
      # 4. CREATE CINEMATIC SCENE GENERATOR
      # ============================================================
      - name: Create cinematic scene generator
        run: |
          cat > work/create_cinematic_scenes.py <<'PY'

          from PIL import (
              Image,
              ImageDraw,
              ImageFilter,
              ImageEnhance
          )

          import math
          import random
          import os


          # ========================================================
          # GLOBAL SETTINGS
          # ========================================================

          W = 1440
          H = 2560

          OUT = "work/scenes"

          os.makedirs(
              OUT,
              exist_ok=True
          )

          random.seed(
              20260916
          )


          # ========================================================
          # IMAGE MODE SAFETY
          # ========================================================

          def ensure_rgba(img):
              return img.convert("RGBA")


          # ========================================================
          # GRADIENT
          # ========================================================

          def gradient(top, bottom):

              img = Image.new(
                  "RGBA",
                  (W, H)
              )

              px = img.load()

              for y in range(H):

                  t = y / (H - 1)

                  r = int(
                      top[0] * (1 - t)
                      + bottom[0] * t
                  )

                  g = int(
                      top[1] * (1 - t)
                      + bottom[1] * t
                  )

                  b = int(
                      top[2] * (1 - t)
                      + bottom[2] * t
                  )

                  for x in range(W):

                      px[x, y] = (
                          r,
                          g,
                          b,
                          255
                      )

              return img


          # ========================================================
          # GLOW
          # ========================================================

          def add_glow(
              base,
              x,
              y,
              radius,
              color,
              alpha
          ):

              base = ensure_rgba(
                  base
              )

              glow = Image.new(
                  "RGBA",
                  (W, H),
                  (0, 0, 0, 0)
              )

              gd = ImageDraw.Draw(
                  glow
              )

              gd.ellipse(
                  (
                      x - radius,
                      y - radius,
                      x + radius,
                      y + radius
                  ),
                  fill=(
                      color[0],
                      color[1],
                      color[2],
                      alpha
                  )
              )

              glow = glow.filter(
                  ImageFilter.GaussianBlur(
                      max(
                          1,
                          radius // 2
                      )
                  )
              )

              return Image.alpha_composite(
                  base,
                  glow
              )


          # ========================================================
          # VIGNETTE
          # ========================================================

          def add_vignette(
              base,
              strength=0.72
          ):

              base = ensure_rgba(
                  base
              )

              overlay = Image.new(
                  "RGBA",
                  (W, H),
                  (0, 0, 0, 0)
              )

              p = overlay.load()

              cx = W / 2
              cy = H / 2

              maxdist = math.sqrt(
                  cx * cx + cy * cy
              )

              for y in range(H):

                  for x in range(W):

                      dx = x - cx
                      dy = y - cy

                      d = (
                          math.sqrt(
                              dx * dx
                              + dy * dy
                          )
                          / maxdist
                      )

                      alpha = int(
                          max(
                              0,
                              min(
                                  210,
                                  (d ** 2.1)
                                  * 255
                                  * strength
                              )
                          )
                      )

                      p[x, y] = (
                          0,
                          0,
                          0,
                          alpha
                      )

              return Image.alpha_composite(
                  base,
                  overlay
              )


          # ========================================================
          # STARS
          # ========================================================

          def add_stars(
              base,
              count=180
          ):

              base = ensure_rgba(
                  base
              )

              layer = Image.new(
                  "RGBA",
                  (W, H),
                  (0, 0, 0, 0)
              )

              d = ImageDraw.Draw(
                  layer
              )

              for _ in range(count):

                  x = random.randint(
                      30,
                      W - 30
                  )

                  y = random.randint(
                      40,
                      int(H * 0.58)
                  )

                  r = random.choice(
                      [
                          1,
                          1,
                          1,
                          2,
                          2,
                          3
                      ]
                  )

                  a = random.randint(
                      70,
                      185
                  )

                  d.ellipse(
                      (
                          x - r,
                          y - r,
                          x + r,
                          y + r
                      ),
                      fill=(
                          255,
                          244,
                          214,
                          a
                      )
                  )

              return Image.alpha_composite(
                  base,
                  layer
              )


          # ========================================================
          # FLOATING PARTICLES
          # ========================================================

          def add_particles(
              base,
              count=100
          ):

              base = ensure_rgba(
                  base
              )

              layer = Image.new(
                  "RGBA",
                  (W, H),
                  (0, 0, 0, 0)
              )

              d = ImageDraw.Draw(
                  layer
              )

              for _ in range(count):

                  x = random.randint(
                      0,
                      W
                  )

                  y = random.randint(
                      0,
                      H
                  )

                  r = random.choice(
                      [
                          2,
                          3,
                          4,
                          5
                      ]
                  )

                  a = random.randint(
                      15,
                      85
                  )

                  d.ellipse(
                      (
                          x - r,
                          y - r,
                          x + r,
                          y + r
                      ),
                      fill=(
                          245,
                          218,
                          160,
                          a
                      )
                  )

              layer = layer.filter(
                  ImageFilter.GaussianBlur(
                      1.5
                  )
              )

              return Image.alpha_composite(
                  base,
                  layer
              )


          # ========================================================
          # LIGHT RAYS
          # ========================================================

          def add_light_rays(
              base,
              origin_x,
              origin_y
          ):

              base = ensure_rgba(
                  base
              )

              layer = Image.new(
                  "RGBA",
                  (W, H),
                  (0, 0, 0, 0)
              )

              d = ImageDraw.Draw(
                  layer
              )

              for i in range(8):

                  spread = (
                      130
                      + i * 80
                  )

                  points = [
                      (
                          origin_x,
                          origin_y
                      ),
                      (
                          origin_x - spread,
                          origin_y + 1100
                      ),
                      (
                          origin_x + spread,
                          origin_y + 1100
                      )
                  ]

                  d.polygon(
                      points,
                      fill=(
                          255,
                          205,
                          115,
                          8
                      )
                  )

              layer = layer.filter(
                  ImageFilter.GaussianBlur(
                      22
                  )
              )

              return Image.alpha_composite(
                  base,
                  layer
              )


          # ========================================================
          # FILM GRAIN
          # ========================================================

          def add_grain(
              base
          ):

              base = ensure_rgba(
                  base
              )

              layer = Image.new(
                  "RGBA",
                  (W, H),
                  (0, 0, 0, 0)
              )

              d = ImageDraw.Draw(
                  layer
              )

              for _ in range(7000):

                  x = random.randrange(
                      W
                  )

                  y = random.randrange(
                      H
                  )

                  c = random.randint(
                      100,
                      230
                  )

                  a = random.randint(
                      4,
                      15
                  )

                  d.point(
                      (x, y),
                      fill=(
                          c,
                          c,
                          c,
                          a
                      )
                  )

              return Image.alpha_composite(
                  base,
                  layer
              )


          # ========================================================
          # SAVE
          # ========================================================

          def save_scene(
              img,
              filename
          ):

              img = ensure_rgba(
                  img
              )

              img = ImageEnhance.Contrast(
                  img
              ).enhance(
                  1.08
              )

              img = ImageEnhance.Color(
                  img
              ).enhance(
                  0.92
              )

              img.convert(
                  "RGB"
              ).save(
                  os.path.join(
                      OUT,
                      filename
                  ),
                  quality=96
              )


          # ========================================================
          # MOSQUE SILHOUETTE
          # ========================================================

          def mosque_silhouette(
              base,
              horizon=1880
          ):

              base = ensure_rgba(
                  base
              )

              layer = Image.new(
                  "RGBA",
                  (W, H),
                  (0, 0, 0, 0)
              )

              d = ImageDraw.Draw(
                  layer
              )

              dark = (
                  7,
                  8,
                  12,
                  255
              )

              # Main building
              d.rectangle(
                  (
                      170,
                      horizon - 250,
                      W - 170,
                      H
                  ),
                  fill=dark
              )

              # Dome
              d.ellipse(
                  (
                      420,
                      horizon - 650,
                      1020,
                      horizon - 70
                  ),
                  fill=dark
              )

              d.rectangle(
                  (
                      500,
                      horizon - 390,
                      940,
                      horizon
                  ),
                  fill=dark
              )

              # Finial
              d.rectangle(
                  (
                      712,
                      horizon - 720,
                      728,
                      horizon - 630
                  ),
                  fill=dark
              )

              d.polygon(
                  [
                      (
                          720,
                          horizon - 770
                      ),
                      (
                          700,
                          horizon - 715
                      ),
                      (
                          740,
                          horizon - 715
                      )
                  ],
                  fill=dark
              )

              # Minarets
              for x in [
                  270,
                  1080
              ]:

                  d.rectangle(
                      (
                          x,
                          horizon - 820,
                          x + 70,
                          horizon
                      ),
                      fill=dark
                  )

                  d.rectangle(
                      (
                          x - 25,
                          horizon - 850,
                          x + 95,
                          horizon - 810
                      ),
                      fill=dark
                  )

                  d.polygon(
                      [
                          (
                              x + 35,
                              horizon - 960
                          ),
                          (
                              x - 5,
                              horizon - 850
                          ),
                          (
                              x + 75,
                              horizon - 850
                          )
                      ],
                      fill=dark
                  )

              # Door
              d.ellipse(
                  (
                      670,
                      horizon - 260,
                      770,
                      horizon + 30
                  ),
                  fill=(
                      2,
                      3,
                      5,
                      255
                  )
              )

              # Windows
              for row in range(2):

                  yy = (
                      horizon
                      - 190
                      + row * 95
                  )

                  for xx in [
                      310,
                      420,
                      1020,
                      1130
                  ]:

                      d.rounded_rectangle(
                          (
                              xx,
                              yy,
                              xx + 55,
                              yy + 95
                          ),
                          radius=25,
                          fill=(
                              34,
                              28,
                              18,
                              255
                          )
                     )

              # Windows
              for row in range(2):

                  yy = (
                      horizon
                      - 190
                      + row * 95
                  )

                  for xx in [
                      310,
                      420,
                      1020,
                      1130
                  ]:

                      d.rounded_rectangle(
                          (
                              xx,
                              yy,
                              xx + 55,
                              yy + 95
                          ),
                          radius=25,
                          fill=(
                              34,
                              28,
                              18,
                              255
                          )
                      )

              return Image.alpha_composite(
                  base,
                  layer
              )


          # ========================================================
          # SCENE 1
          # NIGHT MOSQUE
          # ========================================================

          scene = gradient(
              (4, 8, 17),
              (24, 18, 16)
          )

          scene = add_stars(
              scene,
              230
          )

          scene = add_glow(
              scene,
              1080,
              520,
              320,
              (225, 181, 90),
              45
          )

          scene = add_glow(
              scene,
              720,
              1800,
              500,
              (219, 164, 70),
              28
          )

          scene = add_light_rays(
              scene,
              720,
              1700
          )

          scene = mosque_silhouette(
              scene,
              1880
          )

          scene = add_particles(
              scene,
              110
          )

          scene = add_grain(
              scene
          )

          scene = add_vignette(
              scene,
              0.78
          )

          save_scene(
              scene,
              "scene1.png"
          )


          # ========================================================
          # SCENE 2
          # HADITH BOOK
          # ========================================================

          scene = gradient(
              (16, 11, 9),
              (52, 33, 18)
          )

          scene = add_glow(
              scene,
              1080,
              650,
              520,
              (255, 188, 82),
              68
          )

          wood = Image.new(
              "RGBA",
              (W, H),
              (0, 0, 0, 0)
          )

          wd = ImageDraw.Draw(
              wood
          )

          for y in range(
              1450,
              H
          ):

              shade = int(
                  43
                  + (
                      (y - 1450)
                      / (H - 1450)
                  ) * 30
              )

              wd.line(
                  (
                      0,
                      y,
                      W,
                      y
                  ),
                  fill=(
                      shade,
                      int(shade * 0.68),
                      int(shade * 0.40),
                      255
                  ),
                  width=2
              )

          scene = Image.alpha_composite(
              scene,
              wood
          )


          # Book shadow
          shadow = Image.new(
              "RGBA",
              (W, H),
              (0, 0, 0, 0)
          )

          sd = ImageDraw.Draw(
              shadow
          )

          sd.rounded_rectangle(
              (
                  270,
                  1040,
                  1170,
                  2040
              ),
              radius=60,
              fill=(
                  0,
                  0,
                  0,
                  165
              )
          )

          shadow = shadow.filter(
              ImageFilter.GaussianBlur(
                  40
              )
          )

          scene = Image.alpha_composite(
              scene,
              shadow
          )


          # Book
          book = Image.new(
              "RGBA",
              (W, H),
              (0, 0, 0, 0)
          )

          bd = ImageDraw.Draw(
              book
          )

          bd.rounded_rectangle(
              (
                  300,
                  980,
                  1140,
                  1990
              ),
              radius=45,
              fill=(
                  62,
                  37,
                  18,
                  255
              ),
              outline=(
                  190,
                  142,
                  66,
                  255
              ),
              width=8
          )


          # Left page
          bd.polygon(
              [
                  (720, 1040),
                  (360, 1100),
                  (360, 1910),
                  (720, 1970)
              ],
              fill=(
                  239,
                  227,
                  194,
                  255
              )
          )


          # Right page
          bd.polygon(
              [
                  (720, 1040),
                  (1080, 1100),
                  (1080, 1910),
                  (720, 1970)
              ],
              fill=(
                  226,
                  213,
                  177,
                  255
              )
          )


          # Page lines
          for i in range(13):

              yy = (
                  1160
                  + i * 55
              )

              bd.line(
                  (
                      420,
                      yy,
                      680,
                      yy + 8
                  ),
                  fill=(
                      126,
                      108,
                      77,
                      115
                  ),
                  width=3
              )

              bd.line(
                  (
                      760,
                      yy + 8,
                      1020,
                      yy
                  ),
                  fill=(
                      126,
                      108,
                      77,
                      115
                  ),
                  width=3
              )


          # Decorative center
          bd.ellipse(
              (
                  680,
                  1430,
                  760,
                  1510
              ),
              outline=(
                  157,
                  117,
                  51,
                  220
              ),
              width=4
          )

          scene = Image.alpha_composite(
              scene,
              book
          )

          scene = add_particles(
              scene,
              130
          )

          scene = add_grain(
              scene
          )

          scene = add_vignette(
              scene,
              0.68
          )

          save_scene(
              scene,
              "scene2.png"
          )


          # ========================================================
          # SCENE 3
          # MOONLIT LANDSCAPE
          # ========================================================

          scene = gradient(
              (3, 7, 18),
              (11, 21, 30)
          )

          scene = add_stars(
              scene,
              340
          )

          moon = Image.new(
              "RGBA",
              (W, H),
              (0, 0, 0, 0)
          )

          md = ImageDraw.Draw(
              moon
          )

          md.ellipse(
              (
                  1000,
                  330,
                  1260,
                  590
              ),
              fill=(
                  245,
                  236,
                  203,
                  245
              )
          )

          md.ellipse(
              (
                  1080,
                  285,
                  1320,
                  545
              ),
              fill=(
                  4,
                  8,
                  19,
                  255
              )
          )

          scene = Image.alpha_composite(
              scene,
              moon
          )

          scene = add_glow(
              scene,
              1120,
              460,
              330,
              (240, 230, 195),
              25
          )

          scene = add_glow(
              scene,
              720,
              1770,
              650,
              (65, 113, 125),
              48
          )


          # Mountains
          mountains = Image.new(
              "RGBA",
              (W, H),
              (0, 0, 0, 0)
          )

          m = ImageDraw.Draw(
              mountains
          )

          m.polygon(
              [
                  (0, 1980),
                  (180, 1780),
                  (360, 1920),
                  (610, 1580),
                  (820, 1870),
                  (1080, 1650),
                  (1440, 1930),
                  (1440, H),
                  (0, H)
              ],
              fill=(
                  7,
                  16,
                  21,
                  255
              )
          )

          m.polygon(
              [
                  (0, 2100),
                  (300, 1940),
                  (500, 2050),
                  (780, 1800),
                  (1010, 2020),
                  (1250, 1850),
                  (1440, 2070),
                  (1440, H),
                  (0, H)
              ],
              fill=(
                  4,
                  10,
                  14,
                  255
              )
          )

          scene = Image.alpha_composite(
              scene,
              mountains
          )


          # Foreground reflection
          foreground = Image.new(
              "RGBA",
              (W, H),
              (0, 0, 0, 0)
          )

          fd = ImageDraw.Draw(
              foreground
          )

          for i in range(18):

              yy = (
                  2150
                  + i * 25
              )

              fd.line(
                  (
                      250,
                      yy,
                      1190,
                      yy
                  ),
                  fill=(
                      65,
                      91,
                      90,
                      max(
                          5,
                          35 - i
                      )
                  ),
                  width=3
              )

          scene = Image.alpha_composite(
              scene,
              foreground
          )

          scene = add_particles(
              scene,
              130
          )

          scene = add_grain(
              scene
          )

          scene = add_vignette(
              scene,
              0.74
          )

          save_scene(
              scene,
              "scene3.png"
          )

          PY

          python3 work/create_cinematic_scenes.py


      # ============================================================
      # 5. VERIFY SCENES
      # ============================================================
      - name: Verify generated scenes
        run: |
          echo "Checking scene files..."

          test -s work/scenes/scene1.png
          test -s work/scenes/scene2.png
          test -s work/scenes/scene3.png

          echo "Scene 1:"
          ls -lh work/scenes/scene1.png

          echo "Scene 2:"
          ls -lh work/scenes/scene2.png

          echo "Scene 3:"
          ls -lh work/scenes/scene3.png

          echo "First three scenes successfully generated."      # ============================================================
      # 6. CONTINUE CINEMATIC SCENE GENERATION
      # ============================================================
      - name: Create remaining cinematic scenes
        run: |
          cat > work/create_remaining_scenes.py <<'PY'

          from PIL import Image, ImageDraw, ImageFilter
          import math
          import random
          import os

          W = 1440
          H = 2560
          OUT = "work/scenes"

          random.seed(20260917)

          def rgba(img):
              return img.convert("RGBA")

          def gradient(top, bottom):
              img = Image.new("RGBA", (W, H))
              p = img.load()

              for y in range(H):
                  t = y / (H - 1)

                  r = int(top[0] * (1-t) + bottom[0] * t)
                  g = int(top[1] * (1-t) + bottom[1] * t)
                  b = int(top[2] * (1-t) + bottom[2] * t)

                  for x in range(W):
                      p[x, y] = (r, g, b, 255)

              return img

          def glow(base, x, y, radius, color, alpha):
              base = rgba(base)

              layer = Image.new(
                  "RGBA",
                  (W, H),
                  (0, 0, 0, 0)
              )

              d = ImageDraw.Draw(layer)

              d.ellipse(
                  (
                      x-radius,
                      y-radius,
                      x+radius,
                      y+radius
                  ),
                  fill=(
                      color[0],
                      color[1],
                      color[2],
                      alpha
                  )
              )

              layer = layer.filter(
                  ImageFilter.GaussianBlur(
                      max(2, radius // 2)
                  )
              )

              return Image.alpha_composite(
                  base,
                  layer
              )

          def particles(base, count=130):
              base = rgba(base)

              layer = Image.new(
                  "RGBA",
                  (W, H),
                  (0, 0, 0, 0)
              )

              d = ImageDraw.Draw(layer)

              for _ in range(count):
                  x = random.randint(0, W)
                  y = random.randint(0, H)

                  r = random.randint(1, 5)
                  a = random.randint(12, 75)

                  d.ellipse(
                      (
                          x-r,
                          y-r,
                          x+r,
                          y+r
                      ),
                      fill=(
                          239,
                          208,
                          145,
                          a
                      )
                  )

              layer = layer.filter(
                  ImageFilter.GaussianBlur(1.4)
              )

              return Image.alpha_composite(
                  base,
                  layer
              )

          def grain(base):
              base = rgba(base)

              layer = Image.new(
                  "RGBA",
                  (W, H),
                  (0, 0, 0, 0)
              )

              d = ImageDraw.Draw(layer)

              for _ in range(6000):
                  x = random.randrange(W)
                  y = random.randrange(H)
                  c = random.randint(100, 230)
                  a = random.randint(3, 12)

                  d.point(
                      (x, y),
                      fill=(c, c, c, a)
                  )

              return Image.alpha_composite(
                  base,
                  layer
              )

          def vignette(base):
              base = rgba(base)

              layer = Image.new(
                  "RGBA",
